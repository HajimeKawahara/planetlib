- id: planetlib.radiation.pure_absorption.quantity.transmission
  revision: '1'
  latex: transmission
  description: Layer transmission along the selected ray.
  unit: '1'
  domain: Between zero and one.
- id: planetlib.radiation.pure_absorption.quantity.tau
  revision: '1'
  latex: \tau
  description: Nonnegative vertical optical-depth difference across the layer.
  unit: '1'
