schema_version: '0.6'
model:
  id: planetlib.radiation.pure_absorption
  name: Pure-absorption ray and plane-parallel layer transfer
  description: Static pure absorption and supplied source function at one spectral wavenumber. I and S are physical
    specific intensities per steradian per cm^-1. The layer relation has a source constant across the layer, positive
    direction cosine and optical-depth difference; it is not a linear-source or two-stream closure. The boundary
    I_in is external.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/radiation/pure_absorption.yaml
assumptions:
- statement: There is no scattering or frequency redistribution. The source function is supplied; setting it to
    Planck intensity is an additional thermal/LTE choice.
  evidence:
  - planetlib.radiation.pure_absorption.source
- statement: s increases along the ray, while tau denotes a nonnegative vertical optical-depth increment and mu
    is the absolute direction cosine.
  evidence:
  - planetlib.radiation.pure_absorption.source
- statement: Azimuthal symmetry is assumed only for the hemispheric angular-flux relation. A provider may internally
    store pi*I or pi*S, which requires an explicit local conversion.
  evidence:
  - planetlib.radiation.pure_absorption.source
domains:
- kind: scientific_applicability
  status: unknown
  description: The definition is a conditional partial model, with no adopted empirical validation.
  conditions: []
  evidence:
  - planetlib.radiation.pure_absorption.source
limitations:
- statement: Static pure absorption and supplied source function at one spectral wavenumber. I and S are physical
    specific intensities per steradian per cm^-1. The layer relation has a source constant across the layer, positive
    direction cosine and optical-depth difference; it is not a linear-source or two-stream closure. The boundary
    I_in is external.
  evidence:
  - planetlib.radiation.pure_absorption.source
- statement: Numerical algorithms, fitted data, discretization choices and floating-point accuracy remain provider
    responsibilities.
  evidence:
  - planetlib.radiation.pure_absorption.source
claims:
- id: planetlib.radiation.pure_absorption.mathematical_consistency
  revision: '1'
  kind: theoretical
  statement: The layer solution has the transparent and opaque limits, composes for a common constant source, and
    is an equilibrium fixed point when I_in=S; an isotropic intensity gives F=pi*I.
  scope: Conditional mathematical checks only; neither provider equivalence nor physical applicability is inferred.
  mathematical_models:
  - id: planetlib.radiation.pure_absorption.model
    revision: '1'
- id: planetlib.radiation.pure_absorption.source_correspondence
  revision: '1'
  kind: theoretical
  statement: The shared definitions preserve the selected conventions of the inspected implementation.
  scope: The source supplied the extraction target; a separate correspondence review is required.
  mathematical_models:
  - id: planetlib.radiation.pure_absorption.model
    revision: '1'
- id: planetlib.radiation.pure_absorption.physical_applicability
  revision: '1'
  kind: physical_validation
  statement: The selected relations have adequate accuracy for a specified physical target.
  scope: No target, empirical error criterion or independent observation is selected by this library entry.
  mathematical_models:
  - id: planetlib.radiation.pure_absorption.model
    revision: '1'
