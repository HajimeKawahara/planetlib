- id: planetlib.radiation.pure_absorption.quantity.mu
  revision: '1'
  latex: \mu
  description: Absolute direction cosine relative to the layer normal.
  unit: '1'
  domain: 0 < mu <= 1; zero is only an angular-integral endpoint.
- id: planetlib.radiation.pure_absorption.quantity.I_in
  revision: '1'
  latex: I_{in}
  description: Incident boundary intensity for this ray.
  unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
  domain: Finite real value within the stated scope.
- id: planetlib.radiation.pure_absorption.quantity.I_out
  revision: '1'
  latex: I_{out}
  description: Outgoing boundary intensity for this ray.
  unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
  domain: Finite real value within the stated scope.
- id: planetlib.radiation.pure_absorption.quantity.S
  revision: '1'
  latex: S
  description: Source function constant throughout the layer.
  unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
  domain: Finite real value within the stated scope.
- id: planetlib.radiation.pure_absorption.quantity.I_mu
  revision: '1'
  latex: I_{\mu}
  description: Physical intensity at a boundary as a function of outward direction cosine.
  unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
  domain: Finite real value within the stated scope.
  coordinates:
  - id: planetlib.radiation.pure_absorption.quantity.mu
    revision: '1'
- id: planetlib.radiation.pure_absorption.quantity.F
  revision: '1'
  latex: F
  description: Outgoing hemispheric spectral flux.
  unit: erg s^-1 cm^-2 (cm^-1)^-1
  domain: Finite real value within the stated scope.
equations:
- id: planetlib.radiation.pure_absorption.transfer_equation
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Derivative(Function('I')(Symbol('s', real=True)), Tuple(Symbol('s', real=True), Integer(1))),
      Mul(Integer(-1), Add(Function('I')(Symbol('s', real=True)), Mul(Integer(-1), Function('S_ray')(Symbol('s',
      real=True)))), Function('alpha')(Symbol('s', real=True))))
  description: Absorption transfer along an oriented ray.
  scope: Static pure absorption and supplied source function at one spectral wavenumber. I and S are physical specific
    intensities per steradian per cm^-1. The layer relation has a source constant across the layer, positive direction
    cosine and optical-depth difference; it is not a linear-source or two-stream closure. The boundary I_in is external.
  assumptions: &id002
  - There is no scattering or frequency redistribution. The source function is supplied; setting it to Planck intensity
    is an additional thermal/LTE choice.
  - s increases along the ray, while tau denotes a nonnegative vertical optical-depth increment and mu is the absolute
    direction cosine.
  - Azimuthal symmetry is assumed only for the hemispheric angular-flux relation. A provider may internally store
    pi*I or pi*S, which requires an explicit local conversion.
  symbols:
    I:
      latex: I
      description: Physical spectral specific intensity along a ray.
      unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
    S_ray:
      latex: S_{ray}
      description: Supplied spectral source function along the ray.
      unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
    alpha:
      latex: \alpha
      description: Nonnegative absorption coefficient along the ray.
      unit: cm^-1
    s:
      latex: s
      description: Path coordinate increasing in the propagation direction.
      unit: cm
  evidence:
  - planetlib.radiation.pure_absorption.source
- id: planetlib.radiation.pure_absorption.transmission
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('transmission', real=True), exp(Mul(Integer(-1), Pow(Symbol('mu', real=True), Integer(-1)),
      Symbol('tau', real=True))))
  description: Transmission through a homogeneous optical-depth interval.
  scope: Static pure absorption and supplied source function at one spectral wavenumber. I and S are physical specific
    intensities per steradian per cm^-1. The layer relation has a source constant across the layer, positive direction
    cosine and optical-depth difference; it is not a linear-source or two-stream closure. The boundary I_in is external.
  assumptions: *id002
  symbols:
    mu:
      latex: \mu
      description: Absolute direction cosine relative to the layer normal.
      unit: '1'
    tau:
      latex: \tau
      description: Nonnegative vertical optical-depth difference across the layer.
      unit: '1'
    transmission:
      latex: transmission
      description: Layer transmission along the selected ray.
      unit: '1'
  evidence:
  - planetlib.radiation.pure_absorption.source
- id: planetlib.radiation.pure_absorption.homogeneous_layer
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('I_out', real=True), Add(Mul(Symbol('I_in', real=True), exp(Mul(Integer(-1), Pow(Symbol('mu',
      real=True), Integer(-1)), Symbol('tau', real=True)))), Mul(Symbol('S', real=True), Add(Integer(1), Mul(Integer(-1),
      exp(Mul(Integer(-1), Pow(Symbol('mu', real=True), Integer(-1)), Symbol('tau', real=True))))))))
  description: Formal solution for a constant-source plane-parallel layer.
  scope: Static pure absorption and supplied source function at one spectral wavenumber. I and S are physical specific
    intensities per steradian per cm^-1. The layer relation has a source constant across the layer, positive direction
    cosine and optical-depth difference; it is not a linear-source or two-stream closure. The boundary I_in is external.
  assumptions: *id002
  symbols:
    I_in:
      latex: I_{in}
      description: Incident boundary intensity for this ray.
      unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
    I_out:
      latex: I_{out}
      description: Outgoing boundary intensity for this ray.
      unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
    S:
      latex: S
      description: Source function constant throughout the layer.
      unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
    mu:
      latex: \mu
      description: Absolute direction cosine relative to the layer normal.
      unit: '1'
    tau:
      latex: \tau
      description: Nonnegative vertical optical-depth difference across the layer.
      unit: '1'
  evidence:
  - planetlib.radiation.pure_absorption.source
- id: planetlib.radiation.pure_absorption.flux
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('F', real=True), Mul(Integer(2), pi, Integral(Mul(Symbol('mu', real=True), Function('I_mu')(Symbol('mu',
      real=True))), Tuple(Symbol('mu', real=True), Integer(0), Integer(1)))))
  description: Hemispheric angular flux from physical specific intensity.
  scope: Static pure absorption and supplied source function at one spectral wavenumber. I and S are physical specific
    intensities per steradian per cm^-1. The layer relation has a source constant across the layer, positive direction
    cosine and optical-depth difference; it is not a linear-source or two-stream closure. The boundary I_in is external.
  assumptions: *id002
  symbols:
    F:
      latex: F
      description: Outgoing hemispheric spectral flux.
      unit: erg s^-1 cm^-2 (cm^-1)^-1
    I_mu:
      latex: I_{\mu}
      description: Physical intensity at a boundary as a function of outward direction cosine.
      unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
    mu:
      latex: \mu
      description: Absolute direction cosine relative to the layer normal.
      unit: '1'
  evidence:
  - planetlib.radiation.pure_absorption.source
