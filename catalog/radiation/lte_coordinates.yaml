quantities:
- id: planetlib.radiation.lte.quantity.nl
  revision: '1'
  latex: n_l
  description: Lower-level number density summed over its statistical weight.
  unit: cm^-3
  domain: Positive for the population ratio.
- id: planetlib.radiation.lte.quantity.nu
  revision: '1'
  latex: n_u
  description: Upper-level number density summed over its statistical weight.
  unit: cm^-3
  domain: Positive under the adopted Boltzmann closure.
- id: planetlib.radiation.lte.quantity.gu
  revision: '1'
  latex: g_u
  description: Upper-level statistical weight.
  unit: '1'
  domain: Positive; same grouping as the shared line coefficients.
- id: planetlib.radiation.lte.quantity.gl
  revision: '1'
  latex: g_l
  description: Lower-level statistical weight.
  unit: '1'
  domain: Positive; same grouping as the shared line coefficients.
- id: planetlib.radiation.lte.quantity.nu0
  revision: '1'
  latex: \nu_0
  description: Transition frequency corresponding to the upper-minus-lower energy.
  unit: Hz
  domain: Positive; distinct from the spectral evaluation coordinate.
- id: planetlib.radiation.lte.quantity.T
  revision: '1'
  latex: T
  description: LTE material and Planck radiation temperature.
  unit: K
  domain: Positive.
- id: planetlib.radiation.lte.quantity.h
  revision: '1'
  latex: h
  description: Planck constant for ordinary frequency.
  unit: erg s
  domain: Positive.
- id: planetlib.radiation.lte.quantity.k
  revision: '1'
  latex: k_{\rm B}
  description: Boltzmann constant.
  unit: erg K^-1
  domain: Positive.
- id: planetlib.radiation.lte.quantity.c
  revision: '1'
  latex: c
  description: Vacuum speed of light in cgs length units.
  unit: cm s^-1
  domain: Positive.
- id: planetlib.radiation.lte.quantity.frequency
  revision: '1'
  latex: \nu
  description: Ordinary spectral frequency.
  unit: Hz
  domain: Positive; evaluated at c times the wavenumber.
- id: planetlib.radiation.lte.quantity.wavenumber
  revision: '1'
  latex: \widetilde\nu
  description: Spectroscopic wavenumber, not angular wavenumber.
  unit: cm^-1
  domain: Positive; same photon as frequency.
- id: planetlib.radiation.lte.quantity.Bf
  revision: '1'
  latex: B_\nu
  description: Planck specific intensity per ordinary frequency.
  unit: erg s^-1 cm^-2 sr^-1 Hz^-1
  domain: Positive at positive frequency and temperature.
- id: planetlib.radiation.lte.quantity.Bk
  revision: '1'
  latex: B_{\widetilde\nu}
  description: Planck specific intensity per spectroscopic wavenumber.
  unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
  domain: The same spectral interval as Bf.
- id: planetlib.radiation.lte.quantity.phif
  revision: '1'
  latex: \phi_\nu
  description: Line profile normalized by its integral over ordinary frequency.
  unit: Hz^-1
  domain: Nonnegative; the same profile as phik under coordinate change.
- id: planetlib.radiation.lte.quantity.phik
  revision: '1'
  latex: \phi_{\widetilde\nu}
  description: Line profile normalized by its integral over wavenumber.
  unit: (cm^-1)^-1
  domain: Nonnegative; the same physical profile as phif.
- id: planetlib.radiation.lte.quantity.jf
  revision: '1'
  latex: j_\nu
  description: Emission coefficient per steradian and ordinary frequency.
  unit: erg s^-1 cm^-3 sr^-1 Hz^-1
  domain: Pointwise value at the matched frequency.
- id: planetlib.radiation.lte.quantity.jk
  revision: '1'
  latex: j_{\widetilde\nu}
  description: Emission coefficient per steradian and wavenumber.
  unit: erg s^-1 cm^-3 sr^-1 (cm^-1)^-1
  domain: Pointwise value at the matched wavenumber.
- id: planetlib.radiation.lte.quantity.chif
  revision: '1'
  latex: \chi_\nu
  description: Signed inverse-path extinction evaluated at ordinary frequency.
  unit: cm^-1
  domain: May be negative; it is not a spectral density.
- id: planetlib.radiation.lte.quantity.chik
  revision: '1'
  latex: \chi_{\widetilde\nu}
  description: The same signed inverse-path extinction evaluated at wavenumber.
  unit: cm^-1
  domain: No spectral-density Jacobian multiplies this quantity.
- id: planetlib.radiation.lte.quantity.piB
  revision: '1'
  latex: \pi B_{\widetilde\nu}
  description: Hemispheric blackbody flux per wavenumber, matching ExoJAX piB.
  unit: erg s^-1 cm^-2 (cm^-1)^-1
  domain: Isotropic intensity integrated over an outward hemisphere with cosine weight.
equations:
- id: planetlib.radiation.lte.boltzmann_ratio
  revision: '1'
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Mul(Pow(Symbol(''nl''), Integer(-1)), Symbol(''nu'')), Mul(Pow(Symbol(''gl''),
      Integer(-1)), Symbol(''gu''), exp(Mul(Integer(-1), Pow(Symbol(''T''), Integer(-1)), Symbol(''h''), Pow(Symbol(''k''),
      Integer(-1)), Symbol(''nu0'')))))'}
  description: Boltzmann population ratio for a specified transition.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    T: {latex: T, unit: K, description: LTE material and Planck radiation temperature.}
    gl: {latex: g_l, unit: '1', description: Lower-level statistical weight.}
    gu: {latex: g_u, unit: '1', description: Upper-level statistical weight.}
    h: {latex: h, unit: erg s, description: Planck constant for ordinary frequency.}
    k: {latex: 'k_{\rm B}', unit: erg K^-1, description: Boltzmann constant.}
    nl: {latex: n_l, unit: cm^-3, description: Lower-level number density summed over its statistical weight.}
    nu: {latex: n_u, unit: cm^-3, description: Upper-level number density summed over its statistical weight.}
    nu0: {latex: \nu_0, unit: Hz, description: Transition frequency corresponding to the upper-minus-lower energy.}
  assumptions: &id003
  - Scalar unpolarized radiation in a static local rest frame. Both populations refer to one transition of energy
    h nu0, with positive T and matching statistical weights. Planck intensity is per steradian. Coordinate conversions
    evaluate the same physical frequency f=c*wavenumber, with c in cm/s and wavenumber in inverse cm. Spectral densities
    and normalized profiles acquire the Jacobian c; signed extinction, an inverse path length, does not. The existing
    line-coefficient model uses line-center prefactors, so its LTE source function (for nonzero extinction) is B(nu0,T), not B(f,T) throughout
    an arbitrary broad line. No transport or population solver is selected.
  - All symbols denote numerical magnitudes in the declared units.
  evidence: *id001
- id: planetlib.radiation.lte.planck_frequency
  revision: '1'
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''Bf''), Mul(Integer(2), Pow(Symbol(''c''), Integer(-2)),
      Pow(Symbol(''frequency''), Integer(3)), Symbol(''h''), Pow(Add(exp(Mul(Pow(Symbol(''T''), Integer(-1)), Symbol(''frequency''),
      Symbol(''h''), Pow(Symbol(''k''), Integer(-1)))), Integer(-1)), Integer(-1))))'}
  description: Planck specific intensity per ordinary frequency and steradian.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    Bf: {latex: B_\nu, unit: erg s^-1 cm^-2 sr^-1 Hz^-1, description: Planck specific intensity per ordinary frequency.}
    T: {latex: T, unit: K, description: LTE material and Planck radiation temperature.}
    c: {latex: c, unit: cm s^-1, description: Vacuum speed of light in cgs length units.}
    frequency: {latex: \nu, unit: Hz, description: Ordinary spectral frequency.}
    h: {latex: h, unit: erg s, description: Planck constant for ordinary frequency.}
    k: {latex: 'k_{\rm B}', unit: erg K^-1, description: Boltzmann constant.}
  assumptions: *id003
  evidence: *id001
- id: planetlib.radiation.lte.frequency_coordinate
  revision: '1'
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''frequency''), Mul(Symbol(''c''), Symbol(''wavenumber'')))'}
  description: Coordinate transformation for ordinary frequency and spectroscopic wavenumber.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    c: {latex: c, unit: cm s^-1, description: Vacuum speed of light in cgs length units.}
    frequency: {latex: \nu, unit: Hz, description: Ordinary spectral frequency.}
    wavenumber: {latex: \widetilde\nu, unit: cm^-1, description: 'Spectroscopic wavenumber, not angular wavenumber.'}
  assumptions: *id003
  evidence: *id001
- id: planetlib.radiation.lte.profile_conversion
  revision: '1'
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''phik''), Mul(Symbol(''c''), Symbol(''phif'')))'}
  description: Normalized profile transformed by the spectral Jacobian.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    c: {latex: c, unit: cm s^-1, description: Vacuum speed of light in cgs length units.}
    phif: {latex: \phi_\nu, unit: Hz^-1, description: Line profile normalized by its integral over ordinary frequency.}
    phik: {latex: '\phi_{\widetilde\nu}', unit: (cm^-1)^-1, description: Line profile normalized by its integral
        over wavenumber.}
  assumptions: *id003
  evidence: *id001
- id: planetlib.radiation.lte.emission_conversion
  revision: '1'
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''jk''), Mul(Symbol(''c''), Symbol(''jf'')))'}
  description: Emission spectral density transformed by the same Jacobian.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    c: {latex: c, unit: cm s^-1, description: Vacuum speed of light in cgs length units.}
    jf: {latex: j_\nu, unit: erg s^-1 cm^-3 sr^-1 Hz^-1, description: Emission coefficient per steradian and ordinary
        frequency.}
    jk: {latex: 'j_{\widetilde\nu}', unit: erg s^-1 cm^-3 sr^-1 (cm^-1)^-1, description: Emission coefficient per
        steradian and wavenumber.}
  assumptions: *id003
  evidence: *id001
- id: planetlib.radiation.lte.intensity_conversion
  revision: '1'
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''Bk''), Mul(Symbol(''Bf''), Symbol(''c'')))'}
  description: Planck intensity transformed to the wavenumber coordinate.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    Bf: {latex: B_\nu, unit: erg s^-1 cm^-2 sr^-1 Hz^-1, description: Planck specific intensity per ordinary frequency.}
    Bk: {latex: 'B_{\widetilde\nu}', unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1, description: Planck specific intensity
        per spectroscopic wavenumber.}
    c: {latex: c, unit: cm s^-1, description: Vacuum speed of light in cgs length units.}
  assumptions: *id003
  evidence: *id001
- id: planetlib.radiation.lte.extinction_conversion
  revision: '1'
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''chik''), Symbol(''chif''))'}
  description: Inverse-path extinction is unchanged at matched coordinates.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    chif: {latex: \chi_\nu, unit: cm^-1, description: Signed inverse-path extinction evaluated at ordinary frequency.}
    chik: {latex: '\chi_{\widetilde\nu}', unit: cm^-1, description: The same signed inverse-path extinction evaluated
        at wavenumber.}
  assumptions: *id003
  evidence: *id001
- id: planetlib.radiation.lte.hemisphere_planck
  revision: '1'
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''piB''), Mul(pi, Symbol(''Bk'')))'}
  description: Hemispheric flux for isotropic blackbody intensity.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    Bk: {latex: 'B_{\widetilde\nu}', unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1, description: Planck specific intensity
        per spectroscopic wavenumber.}
    piB: {latex: '\pi B_{\widetilde\nu}', unit: erg s^-1 cm^-2 (cm^-1)^-1, description: 'Hemispheric blackbody flux
        per wavenumber, matching ExoJAX piB.'}
  assumptions: *id003
  evidence: *id001
