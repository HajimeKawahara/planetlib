schema_version: '0.6'
model:
  id: planetlib.radiation.lte.catalog
  name: LTE closure and spectral-coordinate conventions
  description: Scalar unpolarized radiation in a static local rest frame. Both populations refer to one transition
    of energy h nu0, with positive T and matching statistical weights. Planck intensity is per steradian. Coordinate
    conversions evaluate the same physical frequency f=c*wavenumber, with c in cm/s and wavenumber in inverse cm.
    Spectral densities and normalized profiles acquire the Jacobian c; signed extinction, an inverse path length,
    does not. The existing line-coefficient model uses line-center prefactors, so its LTE source function (for nonzero extinction) is B(nu0,T),
    not B(f,T) throughout an arbitrary broad line. No transport or population solver is selected.
  implementation: &id002
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/radiation/lte_coordinates.yaml
assumptions:
- statement: Scalar unpolarized radiation in a static local rest frame. Both populations refer to one transition
    of energy h nu0, with positive T and matching statistical weights. Planck intensity is per steradian. Coordinate
    conversions evaluate the same physical frequency f=c*wavenumber, with c in cm/s and wavenumber in inverse cm.
    Spectral densities and normalized profiles acquire the Jacobian c; signed extinction, an inverse path length,
    does not. The existing line-coefficient model uses line-center prefactors, so its LTE source function (for nonzero extinction) is B(nu0,T),
    not B(f,T) throughout an arbitrary broad line. No transport or population solver is selected.
  evidence: &id001
  - planetlib.radiation.lte.upstream
