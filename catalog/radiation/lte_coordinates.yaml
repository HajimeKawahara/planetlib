claims:
- id: planetlib.radiation.lte.line_source_function
  revision: '1'
  kind: theoretical
  statement: Combining this Boltzmann closure with planetlib.radiation.line.coefficients@2 gives j=chi*B(nu0,T)
    under the shared profile and line-center convention. The ratio j/chi is defined only where chi is nonzero.
  scope: Conditional algebraic consistency of the recorded definitions; no provider equivalence or empirical accuracy
    is inferred.
  mathematical_models:
  - {id: planetlib.radiation.lte.populations, revision: '1'}
- id: planetlib.radiation.lte.coordinate_consistency
  revision: '1'
  kind: theoretical
  statement: The coordinate changes preserve spectral integrals and transform transfer coefficients consistently;
    isotropic hemispheric Planck flux is pi times the intensity.
  scope: Conditional algebraic consistency of the recorded definitions; no provider equivalence or empirical accuracy
    is inferred.
  mathematical_models:
  - {id: planetlib.radiation.lte.coordinates, revision: '1'}
