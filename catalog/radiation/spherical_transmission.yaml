quantities:
- id: planetlib.radiation.spherical_transmission.quantity.r
  revision: '1'
  latex: r
  description: Radius along the chord integral.
  unit: cm
  domain: Positive.
- id: planetlib.radiation.spherical_transmission.quantity.b
  revision: '1'
  latex: b
  description: Ray impact parameter relative to planet center.
  unit: cm
  domain: R0 <= b < R_top.
- id: planetlib.radiation.spherical_transmission.quantity.R0
  revision: '1'
  latex: R_{0}
  description: Opaque lower boundary radius.
  unit: cm
  domain: Positive.
- id: planetlib.radiation.spherical_transmission.quantity.R_top
  revision: '1'
  latex: R_{top}
  description: Atmospheric top radius.
  unit: cm
  domain: Greater than R0.
- id: planetlib.radiation.spherical_transmission.quantity.R_star
  revision: '1'
  latex: R_{star}
  description: Radius of the uniformly bright stellar disk.
  unit: cm
  domain: At least R_top.
- id: planetlib.radiation.spherical_transmission.quantity.alpha
  revision: '1'
  latex: \alpha
  description: Radial absorption coefficient at the chosen spectral coordinate.
  unit: cm^-1
  domain: Nonnegative.
  coordinates:
  - id: planetlib.radiation.spherical_transmission.quantity.r
    revision: '1'
- id: planetlib.radiation.spherical_transmission.quantity.tau_chord
  revision: '1'
  latex: \tau_{chord}
  description: Total near-side plus far-side chord optical depth.
  unit: '1'
  domain: Nonnegative.
  coordinates:
  - id: planetlib.radiation.spherical_transmission.quantity.b
    revision: '1'
- id: planetlib.radiation.spherical_transmission.quantity.R_tr_sq
  revision: '1'
  latex: R_{tr sq}
  description: Square of the effective opaque-disk transit radius.
  unit: cm^2
  domain: Finite real value within the stated scope.
- id: planetlib.radiation.spherical_transmission.quantity.A
  revision: '1'
  latex: A
  description: Transit radius squared divided by the opaque bottom radius squared.
  unit: '1'
  domain: Finite real value within the stated scope.
- id: planetlib.radiation.spherical_transmission.quantity.D
  revision: '1'
  latex: D
  description: Uniform-star transit depth under complete projected overlap.
  unit: '1'
  domain: Finite real value within the stated scope.
equations:
- id: planetlib.radiation.spherical_transmission.chord_depth
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Function('tau_chord')(Symbol('b', real=True)), Mul(Integer(2), Integral(Mul(Symbol('r',
      real=True), Pow(Add(Mul(Integer(-1), Pow(Symbol('b', real=True), Integer(2))), Pow(Symbol('r', real=True),
      Integer(2))), Rational(-1, 2)), Function('alpha')(Symbol('r', real=True))), Tuple(Symbol('r', real=True),
      Symbol('b', real=True), Symbol('R_top', real=True)))))
  description: Two-sided spherical chord optical depth.
  scope: A spherical atmosphere at one spectral coordinate, straight parallel rays, pure absorption, and an opaque
    bottom radius R0 beneath a finite top R_top. The apparent blocked radius, its normalization by R0, and transit
    depth normalized by a uniformly illuminated stellar disk are distinct quantities. Stellar limb darkening, refraction,
    multiple scattering and overlap geometry are external.
  assumptions: &id002
  - R_star >= R_top > R0 > 0, with a central unocculted stellar background for the simple area ratio.
  - alpha is nonnegative and radial only; the chord integral applies for R0 <= b < R_top, with zero atmospheric
    opacity beyond R_top.
  - The opaque lower disk contributes pi*R0^2 even when the atmosphere is transparent. Numerical quadrature and
    cellwise geometric reconstruction are provider choices.
  symbols:
    R_top:
      latex: R_{top}
      description: Atmospheric top radius.
      unit: cm
    alpha:
      latex: \alpha
      description: Radial absorption coefficient at the chosen spectral coordinate.
      unit: cm^-1
    b:
      latex: b
      description: Ray impact parameter relative to planet center.
      unit: cm
    r:
      latex: r
      description: Radius along the chord integral.
      unit: cm
    tau_chord:
      latex: \tau_{chord}
      description: Total near-side plus far-side chord optical depth.
      unit: '1'
  evidence:
  - planetlib.radiation.spherical_transmission.source
- id: planetlib.radiation.spherical_transmission.blocked_area
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('R_tr_sq', real=True), Add(Pow(Symbol('R0', real=True), Integer(2)), Mul(Integer(2),
      Integral(Mul(Symbol('b', real=True), Add(Integer(1), Mul(Integer(-1), exp(Mul(Integer(-1), Function('tau_chord')(Symbol('b',
      real=True))))))), Tuple(Symbol('b', real=True), Symbol('R0', real=True), Symbol('R_top', real=True))))))
  description: Opaque-bottom disk plus atmospheric blocked area, divided by pi.
  scope: A spherical atmosphere at one spectral coordinate, straight parallel rays, pure absorption, and an opaque
    bottom radius R0 beneath a finite top R_top. The apparent blocked radius, its normalization by R0, and transit
    depth normalized by a uniformly illuminated stellar disk are distinct quantities. Stellar limb darkening, refraction,
    multiple scattering and overlap geometry are external.
  assumptions: *id002
  symbols:
    R0:
      latex: R_{0}
      description: Opaque lower boundary radius.
      unit: cm
    R_top:
      latex: R_{top}
      description: Atmospheric top radius.
      unit: cm
    R_tr_sq:
      latex: R_{tr sq}
      description: Square of the effective opaque-disk transit radius.
      unit: cm^2
    b:
      latex: b
      description: Ray impact parameter relative to planet center.
      unit: cm
    tau_chord:
      latex: \tau_{chord}
      description: Total near-side plus far-side chord optical depth.
      unit: '1'
  evidence:
  - planetlib.radiation.spherical_transmission.source
- id: planetlib.radiation.spherical_transmission.normalized_radius
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('A', real=True), Mul(Pow(Symbol('R0', real=True), Integer(-2)), Symbol('R_tr_sq',
      real=True)))
  description: Transit-radius normalization used independently of stellar size.
  scope: A spherical atmosphere at one spectral coordinate, straight parallel rays, pure absorption, and an opaque
    bottom radius R0 beneath a finite top R_top. The apparent blocked radius, its normalization by R0, and transit
    depth normalized by a uniformly illuminated stellar disk are distinct quantities. Stellar limb darkening, refraction,
    multiple scattering and overlap geometry are external.
  assumptions: *id002
  symbols:
    A:
      latex: A
      description: Transit radius squared divided by the opaque bottom radius squared.
      unit: '1'
    R0:
      latex: R_{0}
      description: Opaque lower boundary radius.
      unit: cm
    R_tr_sq:
      latex: R_{tr sq}
      description: Square of the effective opaque-disk transit radius.
      unit: cm^2
  evidence:
  - planetlib.radiation.spherical_transmission.source
- id: planetlib.radiation.spherical_transmission.transit_depth
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('D', real=True), Mul(Pow(Symbol('R_star', real=True), Integer(-2)), Symbol('R_tr_sq',
      real=True)))
  description: Conversion to the transit depth for a uniform stellar disk.
  scope: A spherical atmosphere at one spectral coordinate, straight parallel rays, pure absorption, and an opaque
    bottom radius R0 beneath a finite top R_top. The apparent blocked radius, its normalization by R0, and transit
    depth normalized by a uniformly illuminated stellar disk are distinct quantities. Stellar limb darkening, refraction,
    multiple scattering and overlap geometry are external.
  assumptions: *id002
  symbols:
    D:
      latex: D
      description: Uniform-star transit depth under complete projected overlap.
      unit: '1'
    R_star:
      latex: R_{star}
      description: Radius of the uniformly bright stellar disk.
      unit: cm
    R_tr_sq:
      latex: R_{tr sq}
      description: Square of the effective opaque-disk transit radius.
      unit: cm^2
  evidence:
  - planetlib.radiation.spherical_transmission.source
