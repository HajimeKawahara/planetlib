schema_version: '0.6'
model:
  id: planetlib.radiation.spherical_transmission
  name: Spherical pure-absorption transit geometry
  description: A spherical atmosphere at one spectral coordinate, straight parallel rays, pure absorption, and an
    opaque bottom radius R0 beneath a finite top R_top. The apparent blocked radius, its normalization by R0, and
    transit depth normalized by a uniformly illuminated stellar disk are distinct quantities. Stellar limb darkening,
    refraction, multiple scattering and overlap geometry are external.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/radiation/spherical_transmission.yaml
assumptions:
- statement: R_star >= R_top > R0 > 0, with a central unocculted stellar background for the simple area ratio.
  evidence:
  - planetlib.radiation.spherical_transmission.source
- statement: alpha is nonnegative and radial only; the chord integral applies for R0 <= b < R_top, with zero atmospheric
    opacity beyond R_top.
  evidence:
  - planetlib.radiation.spherical_transmission.source
- statement: The opaque lower disk contributes pi*R0^2 even when the atmosphere is transparent. Numerical quadrature
    and cellwise geometric reconstruction are provider choices.
  evidence:
  - planetlib.radiation.spherical_transmission.source
domains:
- kind: scientific_applicability
  status: unknown
  description: The definition is a conditional partial model, with no adopted empirical validation.
  conditions: []
  evidence:
  - planetlib.radiation.spherical_transmission.source
limitations:
- statement: A spherical atmosphere at one spectral coordinate, straight parallel rays, pure absorption, and an
    opaque bottom radius R0 beneath a finite top R_top. The apparent blocked radius, its normalization by R0, and
    transit depth normalized by a uniformly illuminated stellar disk are distinct quantities. Stellar limb darkening,
    refraction, multiple scattering and overlap geometry are external.
  evidence:
  - planetlib.radiation.spherical_transmission.source
- statement: Numerical algorithms, fitted data, discretization choices and floating-point accuracy remain provider
    responsibilities.
  evidence:
  - planetlib.radiation.spherical_transmission.source
claims:
- id: planetlib.radiation.spherical_transmission.mathematical_consistency
  revision: '1'
  kind: theoretical
  statement: A transparent atmosphere leaves R_tr_sq=R0^2, an everywhere opaque atmosphere approaches R_top^2, and
    normalizing by R0 differs explicitly from normalizing by the stellar radius.
  scope: Conditional mathematical checks only; neither provider equivalence nor physical applicability is inferred.
  mathematical_models:
  - id: planetlib.radiation.spherical_transmission.model
    revision: '1'
- id: planetlib.radiation.spherical_transmission.source_correspondence
  revision: '1'
  kind: theoretical
  statement: The shared definitions preserve the selected conventions of the inspected implementation.
  scope: The source supplied the extraction target; a separate correspondence review is required.
  mathematical_models:
  - id: planetlib.radiation.spherical_transmission.model
    revision: '1'
- id: planetlib.radiation.spherical_transmission.physical_applicability
  revision: '1'
  kind: physical_validation
  statement: The selected relations have adequate accuracy for a specified physical target.
  scope: No target, empirical error criterion or independent observation is selected by this library entry.
  mathematical_models:
  - id: planetlib.radiation.spherical_transmission.model
    revision: '1'
evidence:
- id: planetlib.radiation.spherical_transmission.source
  kind: implementation
  summary: Mathematical conventions extracted from immutable ExoJAX source.
  sources:
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/rt/chord.py
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/rt/trans.py
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/rt/rtransfer.py
  scope: The cited source implementations were inspected. This is not a new inspection of their original literature
    or a transferred provider assessment.
  provenance:
    role: implementation
    location: The functions and conventions identified by the immutable source paths.
    inspection: inspected
    note: Shared mathematical definitions are distinct from numerical approximation and physical applicability.
