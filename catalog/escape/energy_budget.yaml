quantities:
- id: planetlib.escape.energy.quantity.r
  revision: '1'
  latex: r
  description: Spherical radius increasing outward.
  unit: cm
  domain: Positive radius in a smooth steady flow.
- id: planetlib.escape.energy.quantity.mdot
  revision: '1'
  latex: \dot M
  description: Constant total outward mass flow rate, integrated over the full sphere.
  unit: g s^-1
  domain: Positive and spatially constant; not mass flux per unit solid angle.
- id: planetlib.escape.energy.quantity.F
  revision: '1'
  latex: F_{\rm rad}
  description: Frequency-integrated physical radial radiative flux; F=4 pi times the integrated first moment.
  unit: erg s^-1 cm^-2
  domain: Signed flux over the same transported frequency set as the exchange source.
  coordinates:
  - {id: planetlib.escape.energy.quantity.r, revision: '1'}
- id: planetlib.escape.energy.quantity.H
  revision: '1'
  latex: \overline H
  description: Frequency integral of the radiative first moment, excluding its angular factor 4 pi.
  unit: erg s^-1 cm^-2 sr^-1
  domain: The same transported spectrum used for S and F.
  coordinates:
  - {id: planetlib.escape.energy.quantity.r, revision: '1'}
- id: planetlib.escape.energy.quantity.S
  revision: '1'
  latex: \mathcal S
  description: Frequency integral of chi_nu J_nu minus j_nu before multiplication by 4 pi.
  unit: erg s^-1 cm^-3 sr^-1
  domain: Signed absorbed-minus-emitted radiation source from the same field and coefficients as transfer.
  coordinates:
  - {id: planetlib.escape.energy.quantity.r, revision: '1'}
- id: planetlib.escape.energy.quantity.C
  revision: '1'
  latex: C_{2\gamma}
  description: Escaping two-photon radiation loss outside the transported frequency model.
  unit: erg s^-1 cm^-3
  domain: Nonnegative; omit this separate term if those photons are included in emissivity.
  coordinates:
  - {id: planetlib.escape.energy.quantity.r, revision: '1'}
- id: planetlib.escape.energy.quantity.Q
  revision: '1'
  latex: \mathcal H
  description: Net external material heating including the separately escaping channel.
  unit: erg s^-1 cm^-3
  domain: Total photon energy transfer, not excess-energy-only photoheating.
  coordinates:
  - {id: planetlib.escape.energy.quantity.r, revision: '1'}
- id: planetlib.escape.energy.quantity.B
  revision: '1'
  latex: \mathcal B
  description: Specific kinetic plus enthalpy plus gravitational energy; material enthalpy includes excitation and
    ionization.
  unit: erg g^-1
  domain: A smooth total material energy per unit mass; no separate collisional cooling subtraction.
  coordinates:
  - {id: planetlib.escape.energy.quantity.r, revision: '1'}
- id: planetlib.escape.energy.quantity.r_left
  revision: '1'
  latex: r_L
  description: Inner radius of the same finite shell.
  unit: cm
  domain: 0 < r_left < r_right.
- id: planetlib.escape.energy.quantity.r_right
  revision: '1'
  latex: r_R
  description: Outer radius of the same finite shell.
  unit: cm
  domain: 0 < r_left < r_right.
- id: planetlib.escape.energy.quantity.V
  revision: '1'
  latex: V
  description: Shell volume factor per unit solid angle, excluding 4 pi.
  unit: cm^3
  domain: Exactly (r_right^3-r_left^3)/3 and shared by both energy updates.
- id: planetlib.escape.energy.quantity.F_left
  revision: '1'
  latex: F_L
  description: Physical radiative flux at the inner shell edge.
  unit: erg s^-1 cm^-2
  domain: Shared edge flux, with the same frequency weights as the neighboring cell.
- id: planetlib.escape.energy.quantity.F_right
  revision: '1'
  latex: F_R
  description: Physical radiative flux at the outer shell edge.
  unit: erg s^-1 cm^-2
  domain: Shared edge flux, with the same frequency weights as the neighboring cell.
- id: planetlib.escape.energy.quantity.B_left
  revision: '1'
  latex: \mathcal B_L
  description: Total specific material energy at the inner shell edge.
  unit: erg g^-1
  domain: The same total-material-energy convention as B.
- id: planetlib.escape.energy.quantity.B_right
  revision: '1'
  latex: \mathcal B_R
  description: Total specific material energy at the outer shell edge.
  unit: erg g^-1
  domain: The same total-material-energy convention as B.
- id: planetlib.escape.energy.quantity.S_cell
  revision: '1'
  latex: \mathcal S_k
  description: Cell mean of the transported absorbed-minus-emitted source before 4 pi.
  unit: erg s^-1 cm^-3 sr^-1
  domain: Identical value and frequency weights in the material and radiation updates.
- id: planetlib.escape.energy.quantity.C_cell
  revision: '1'
  latex: C_{2\gamma,k}
  description: Cell mean escaping two-photon loss excluded from transported emissivity.
  unit: erg s^-1 cm^-3
  domain: Shared shell-volume weighting; nonnegative physical loss.
equations:
- id: planetlib.escape.energy.flux_moment
  revision: '1'
  description: Convert the frequency-integrated first radiation moment to physical flux.
  scope: The angular integral contributes 4 pi independently of the spherical surface-area factor.
  symbols:
    F: {latex: 'F_{\rm rad}', description: Frequency-integrated physical radial radiative flux; F=4 pi times the
        integrated first moment., unit: erg s^-1 cm^-2}
    H: {latex: \overline H, description: 'Frequency integral of the radiative first moment, excluding its angular
        factor 4 pi.', unit: erg s^-1 cm^-2 sr^-1}
    r: {latex: r, description: Spherical radius increasing outward., unit: cm}
  assumptions: &id002
  - Steady spherical transport and constant total mass flow; all symbols denote numerical magnitudes in their declared
    cgs units.
  - The transported source S, flux F and first moment H use the same frequency range, weights, radiation field and
    extinction/emissivity; the physical coupling is one, not an intermediate continuation value.
  - The material energy includes excitation and ionization; collisional redistribution is internal and must not
    be subtracted as another external cooling term.
  - Two-photon loss C is outside the transported emissivity. If those photons enter j_nu, remove the separate C
    term to avoid double counting.
  - The source-cancellation identity uses only the zeroth radiation moment; it does not validate an Eddington closure,
    angular transport or boundary illumination.
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Function(''F'')(Symbol(''r'', positive=True)), Mul(Integer(4),
      pi, Function(''H'')(Symbol(''r'', positive=True))))'}
- id: planetlib.escape.energy.material_heating
  revision: '1'
  description: Combine transported photon heating and an explicitly escaping channel.
  scope: Full photon energy goes into the total material-energy budget.
  symbols:
    C: {latex: 'C_{2\gamma}', description: Escaping two-photon radiation loss outside the transported frequency
        model., unit: erg s^-1 cm^-3}
    Q: {latex: \mathcal H, description: Net external material heating including the separately escaping channel.,
      unit: erg s^-1 cm^-3}
    S: {latex: \mathcal S, description: Frequency integral of chi_nu J_nu minus j_nu before multiplication by 4
        pi., unit: erg s^-1 cm^-3 sr^-1}
    r: {latex: r, description: Spherical radius increasing outward., unit: cm}
  assumptions: *id002
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Function(''Q'')(Symbol(''r'', positive=True)), Add(Mul(Integer(-1),
      Function(''C'')(Symbol(''r'', positive=True))), Mul(Integer(4), pi, Function(''S'')(Symbol(''r'', positive=True)))))'}
- id: planetlib.escape.energy.radiation_balance
  revision: '1'
  description: Frequency-integrated zeroth radiation moment in spherical geometry.
  scope: Smooth fields; the integrated source must be the same one used for material heating.
  symbols:
    F: {latex: 'F_{\rm rad}', description: Frequency-integrated physical radial radiative flux; F=4 pi times the
        integrated first moment., unit: erg s^-1 cm^-2}
    S: {latex: \mathcal S, description: Frequency integral of chi_nu J_nu minus j_nu before multiplication by 4
        pi., unit: erg s^-1 cm^-3 sr^-1}
    r: {latex: r, description: Spherical radius increasing outward., unit: cm}
  assumptions: *id002
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Derivative(Mul(Pow(Symbol(''r'', positive=True), Integer(2)),
      Function(''F'')(Symbol(''r'', positive=True))), Tuple(Symbol(''r'', positive=True), Integer(1))), Mul(Integer(-1),
      Integer(4), pi, Pow(Symbol(''r'', positive=True), Integer(2)), Function(''S'')(Symbol(''r'', positive=True))))'}
- id: planetlib.escape.energy.material_balance
  revision: '1'
  description: Advected total material-energy flux driven by the net external heating.
  scope: Mass flow is constant and contains the full solid-angle factor 4 pi.
  symbols:
    B: {latex: \mathcal B, description: Specific kinetic plus enthalpy plus gravitational energy; material enthalpy
        includes excitation and ionization., unit: erg g^-1}
    Q: {latex: \mathcal H, description: Net external material heating including the separately escaping channel.,
      unit: erg s^-1 cm^-3}
    mdot: {latex: \dot M, description: 'Constant total outward mass flow rate, integrated over the full sphere.',
      unit: g s^-1}
    r: {latex: r, description: Spherical radius increasing outward., unit: cm}
  assumptions: *id002
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Mul(Symbol(''mdot'', positive=True), Derivative(Function(''B'')(Symbol(''r'',
      positive=True)), Tuple(Symbol(''r'', positive=True), Integer(1)))), Mul(Integer(4), pi, Pow(Symbol(''r'',
      positive=True), Integer(2)), Function(''Q'')(Symbol(''r'', positive=True))))'}
- id: planetlib.escape.energy.total_balance
  revision: '1'
  description: Total radiation plus matter energy has only the declared escaping loss.
  scope: A consequence of the two balances and the heating definition; no existence or closure-accuracy claim.
  symbols:
    B: {latex: \mathcal B, description: Specific kinetic plus enthalpy plus gravitational energy; material enthalpy
        includes excitation and ionization., unit: erg g^-1}
    C: {latex: 'C_{2\gamma}', description: Escaping two-photon radiation loss outside the transported frequency
        model., unit: erg s^-1 cm^-3}
    F: {latex: 'F_{\rm rad}', description: Frequency-integrated physical radial radiative flux; F=4 pi times the
        integrated first moment., unit: erg s^-1 cm^-2}
    mdot: {latex: \dot M, description: 'Constant total outward mass flow rate, integrated over the full sphere.',
      unit: g s^-1}
    r: {latex: r, description: Spherical radius increasing outward., unit: cm}
  assumptions: *id002
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Derivative(Add(Mul(Symbol(''mdot'', positive=True), Function(''B'')(Symbol(''r'',
      positive=True))), Mul(Integer(4), pi, Pow(Symbol(''r'', positive=True), Integer(2)), Function(''F'')(Symbol(''r'',
      positive=True)))), Tuple(Symbol(''r'', positive=True), Integer(1))), Mul(Integer(-1), Integer(4), pi, Pow(Symbol(''r'',
      positive=True), Integer(2)), Function(''C'')(Symbol(''r'', positive=True))))'}
- id: planetlib.escape.energy.shell_volume
  revision: '1'
  description: Define the spherical shell-volume factor without 4 pi.
  scope: Ordered positive shell edges; no planar approximation.
  symbols:
    V: {latex: V, description: 'Shell volume factor per unit solid angle, excluding 4 pi.', unit: cm^3}
    r_left: {latex: r_L, description: Inner radius of the same finite shell., unit: cm}
    r_right: {latex: r_R, description: Outer radius of the same finite shell., unit: cm}
  assumptions: *id002
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''V'', positive=True), Add(Mul(Integer(-1), Rational(1,
      3), Pow(Symbol(''r_left'', positive=True), Integer(3))), Mul(Rational(1, 3), Pow(Symbol(''r_right'', positive=True),
      Integer(3)))))'}
- id: planetlib.escape.energy.cell_radiation
  revision: '1'
  description: Integrate the radiation exchange over the shared shell.
  scope: The single cell source is a common frequency-weighted value; its spatial approximation remains a provider
    choice.
  symbols:
    F_left: {latex: F_L, description: Physical radiative flux at the inner shell edge., unit: erg s^-1 cm^-2}
    F_right: {latex: F_R, description: Physical radiative flux at the outer shell edge., unit: erg s^-1 cm^-2}
    S_cell: {latex: \mathcal S_k, description: Cell mean of the transported absorbed-minus-emitted source before
        4 pi., unit: erg s^-1 cm^-3 sr^-1}
    V: {latex: V, description: 'Shell volume factor per unit solid angle, excluding 4 pi.', unit: cm^3}
    r_left: {latex: r_L, description: Inner radius of the same finite shell., unit: cm}
    r_right: {latex: r_R, description: Outer radius of the same finite shell., unit: cm}
  assumptions: *id002
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Add(Mul(Integer(-1), Symbol(''F_left'', real=True), Pow(Symbol(''r_left'',
      positive=True), Integer(2))), Mul(Symbol(''F_right'', real=True), Pow(Symbol(''r_right'', positive=True),
      Integer(2)))), Mul(Integer(-1), Integer(4), pi, Symbol(''S_cell'', real=True), Symbol(''V'', positive=True)))'}
- id: planetlib.escape.energy.cell_material
  revision: '1'
  description: Integrate total material exchange over the same shell.
  scope: The mass rate divided by 4 pi is the per-solid-angle flow used with V; identical cell source and weights
    are required.
  symbols:
    B_left: {latex: \mathcal B_L, description: Total specific material energy at the inner shell edge., unit: erg
        g^-1}
    B_right: {latex: \mathcal B_R, description: Total specific material energy at the outer shell edge., unit: erg
        g^-1}
    C_cell: {latex: 'C_{2\gamma,k}', description: Cell mean escaping two-photon loss excluded from transported emissivity.,
      unit: erg s^-1 cm^-3}
    S_cell: {latex: \mathcal S_k, description: Cell mean of the transported absorbed-minus-emitted source before
        4 pi., unit: erg s^-1 cm^-3 sr^-1}
    V: {latex: V, description: 'Shell volume factor per unit solid angle, excluding 4 pi.', unit: cm^3}
    mdot: {latex: \dot M, description: 'Constant total outward mass flow rate, integrated over the full sphere.',
      unit: g s^-1}
  assumptions: *id002
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Mul(Rational(1, 4), Pow(pi, Integer(-1)), Symbol(''mdot'',
      positive=True), Add(Mul(Integer(-1), Symbol(''B_left'', real=True)), Symbol(''B_right'', real=True))), Mul(Symbol(''V'',
      positive=True), Add(Mul(Integer(-1), Symbol(''C_cell'', real=True)), Mul(Integer(4), pi, Symbol(''S_cell'',
      real=True)))))'}
- id: planetlib.escape.energy.cell_total
  revision: '1'
  description: Cancel the material/radiation cell exchange and retain the escaping loss.
  scope: Adjacent cells must share edge fluxes and material states for global telescoping. Exact algebra does not
    establish finite-precision accuracy or grid convergence.
  symbols:
    B_left: {latex: \mathcal B_L, description: Total specific material energy at the inner shell edge., unit: erg
        g^-1}
    B_right: {latex: \mathcal B_R, description: Total specific material energy at the outer shell edge., unit: erg
        g^-1}
    C_cell: {latex: 'C_{2\gamma,k}', description: Cell mean escaping two-photon loss excluded from transported emissivity.,
      unit: erg s^-1 cm^-3}
    F_left: {latex: F_L, description: Physical radiative flux at the inner shell edge., unit: erg s^-1 cm^-2}
    F_right: {latex: F_R, description: Physical radiative flux at the outer shell edge., unit: erg s^-1 cm^-2}
    V: {latex: V, description: 'Shell volume factor per unit solid angle, excluding 4 pi.', unit: cm^3}
    mdot: {latex: \dot M, description: 'Constant total outward mass flow rate, integrated over the full sphere.',
      unit: g s^-1}
    r_left: {latex: r_L, description: Inner radius of the same finite shell., unit: cm}
    r_right: {latex: r_R, description: Outer radius of the same finite shell., unit: cm}
  assumptions: *id002
  evidence:
  - planetlib.escape.energy.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Add(Mul(Integer(4), pi, Symbol(''C_cell'', real=True), Symbol(''V'',
      positive=True)), Mul(Symbol(''mdot'', positive=True), Add(Mul(Integer(-1), Symbol(''B_left'', real=True)),
      Symbol(''B_right'', real=True))), Mul(Integer(4), pi, Add(Mul(Integer(-1), Symbol(''F_left'', real=True),
      Pow(Symbol(''r_left'', positive=True), Integer(2))), Mul(Symbol(''F_right'', real=True), Pow(Symbol(''r_right'',
      positive=True), Integer(2)))))), Integer(0))'}
mathematical_models:
- id: planetlib.escape.energy.continuum
  revision: '1'
  description: Open spherical radiation/material energy budget.
  scope: S and C are supplied shared sources; mdot is supplied. F, H and B require a separate transport/material
    closure and boundary conditions. This model records balance and its derived identity only.
  quantities:
    B: {quantity: {id: planetlib.escape.energy.quantity.B, revision: '1'}, role: unknown}
    C: {quantity: {id: planetlib.escape.energy.quantity.C, revision: '1'}, role: input}
    F: {quantity: {id: planetlib.escape.energy.quantity.F, revision: '1'}, role: unknown}
    H: {quantity: {id: planetlib.escape.energy.quantity.H, revision: '1'}, role: unknown}
    Q: {quantity: {id: planetlib.escape.energy.quantity.Q, revision: '1'}, role: derived}
    S: {quantity: {id: planetlib.escape.energy.quantity.S, revision: '1'}, role: input}
    mdot: {quantity: {id: planetlib.escape.energy.quantity.mdot, revision: '1'}, role: parameter}
    r: {quantity: {id: planetlib.escape.energy.quantity.r, revision: '1'}, role: coordinate}
  relations:
  - id: planetlib.escape.energy.continuum.flux_moment
    equation: {id: planetlib.escape.energy.flux_moment, revision: '1'}
    role: Flux convention
    quantities: {F: F, H: H, r: r}
  - id: planetlib.escape.energy.continuum.material_heating
    equation: {id: planetlib.escape.energy.material_heating, revision: '1'}
    role: Net material source
    quantities:
      C: C
      Q: Q
      S: S
      r: r
  - id: planetlib.escape.energy.continuum.radiation_balance
    equation: {id: planetlib.escape.energy.radiation_balance, revision: '1'}
    role: Radiation energy balance
    quantities: {F: F, S: S, r: r}
  - id: planetlib.escape.energy.continuum.material_balance
    equation: {id: planetlib.escape.energy.material_balance, revision: '1'}
    role: Material energy balance
    quantities:
      B: B
      Q: Q
      mdot: mdot
      r: r
  - id: planetlib.escape.energy.continuum.total_balance
    equation: {id: planetlib.escape.energy.total_balance, revision: '1'}
    role: Derived continuum conservation identity
    quantities:
      B: B
      C: C
      F: F
      mdot: mdot
