schema_version: '0.6'
model:
  id: planetlib.escape.energy.catalog
  name: Shared spherical material and radiation energy budget
  description: Integrated continuum and finite-shell relations that expose source cancellation and angular/geometry
    conventions.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/escape/energy_budget.yaml
assumptions:
- statement: Steady spherical transport and constant total mass flow; all symbols denote numerical magnitudes in
    their declared cgs units.
  evidence:
  - planetlib.escape.energy.upstream
- statement: The transported source S, flux F and first moment H use the same frequency range, weights, radiation
    field and extinction/emissivity; the physical coupling is one, not an intermediate continuation value.
  evidence:
  - planetlib.escape.energy.upstream
- statement: The material energy includes excitation and ionization; collisional redistribution is internal and
    must not be subtracted as another external cooling term.
  evidence:
  - planetlib.escape.energy.upstream
- statement: Two-photon loss C is outside the transported emissivity. If those photons enter j_nu, remove the separate
    C term to avoid double counting.
  evidence:
  - planetlib.escape.energy.upstream
- statement: The source-cancellation identity uses only the zeroth radiation moment; it does not validate an Eddington
    closure, angular transport or boundary illumination.
  evidence:
  - planetlib.escape.energy.upstream
domains:
- kind: scientific_applicability
  status: unknown
  description: Algebraic consistency does not establish astrophysical accuracy, closure adequacy or a complete boundary-value
    problem.
  conditions: []
  evidence:
  - planetlib.escape.energy.upstream
limitations:
- statement: Numerical solvers, convergence, source accuracy, branch existence and physical applicability require
    separate provider or study assessments.
  evidence:
  - planetlib.escape.energy.upstream
claims:
- id: planetlib.escape.energy.continuum_cancellation
  revision: '1'
  kind: theoretical
  statement: The continuum total-energy identity follows from the two balances and common material-heating definition.
  scope: Symbolic source cancellation for smooth fields with constant mdot and physical coupling one; no general
    PDE-solution claim.
  mathematical_models:
  - {id: planetlib.escape.energy.continuum, revision: '1'}
- id: planetlib.escape.energy.cell_cancellation
  revision: '1'
  kind: theoretical
  statement: Shared cell sources cancel and adjacent total-energy fluxes telescope.
  scope: Exact finite-shell algebra with identical sources, volumes and shared edges; no convergence or floating-point-error
    claim.
  mathematical_models:
  - {id: planetlib.escape.energy.finite_volume, revision: '1'}
- id: planetlib.escape.energy.source_correspondence
  revision: '1'
  kind: theoretical
  statement: The extracted definitions preserve the declared upstream conventions within the stated reduced scope.
  scope: A source-extraction proposition; passing symbolic identity tests alone does not establish correspondence
    to provider code.
  mathematical_models:
  - {id: planetlib.escape.energy.continuum, revision: '1'}
  - {id: planetlib.escape.energy.finite_volume, revision: '1'}
evidence:
- id: planetlib.escape.energy.upstream
  kind: theory
  summary: Inspected pinned escape definitions and the corresponding implementation conventions.
  sources:
