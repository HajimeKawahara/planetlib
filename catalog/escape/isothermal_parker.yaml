    a: {quantity: {id: planetlib.escape.parker.quantity.a, revision: '1'}, role: parameter}
    gm: {quantity: {id: planetlib.escape.parker.quantity.gm, revision: '1'}, role: parameter}
    mdot: {quantity: {id: planetlib.escape.parker.quantity.mdot, revision: '1'}, role: input}
    r: {quantity: {id: planetlib.escape.parker.quantity.r, revision: '1'}, role: coordinate}
