quantities:
- id: planetlib.escape.parker.quantity.r
  revision: '1'
  latex: r
  description: Radius from the point-mass center.
  unit: cm
  domain: Positive radius.
- id: planetlib.escape.parker.quantity.mdot
  revision: '1'
  latex: \dot M
  description: Total outward mass flow through a sphere.
  unit: g s^-1
  domain: Positive constant; no distributed mass source.
- id: planetlib.escape.parker.quantity.v
  revision: '1'
  latex: v
  description: Outward radial material velocity.
  unit: cm s^-1
  domain: Positive smooth velocity; an accelerating transonic branch is selected only for the sonic-slope relation.
  coordinates:
  - {id: planetlib.escape.parker.quantity.r, revision: '1'}
- id: planetlib.escape.parker.quantity.rho
  revision: '1'
  latex: \rho
  description: Total material mass density.
  unit: g cm^-3
  domain: Positive smooth density of the same flow.
  coordinates:
  - {id: planetlib.escape.parker.quantity.r, revision: '1'}
- id: planetlib.escape.parker.quantity.P
  revision: '1'
  latex: P
  description: Gas pressure supporting the isothermal flow.
  unit: erg cm^-3
  domain: Positive smooth gas pressure; no radiation pressure.
  coordinates:
  - {id: planetlib.escape.parker.quantity.r, revision: '1'}
- id: planetlib.escape.parker.quantity.a
  revision: '1'
  latex: a
  description: Constant isothermal sound speed with fixed temperature and mean molecular weight.
  unit: cm s^-1
  domain: Positive, independent of radius; distinct from an adiabatic sound speed.
- id: planetlib.escape.parker.quantity.gm
  revision: '1'
  latex: GM
  description: Point-mass gravitational parameter.
  unit: cm^3 s^-2
  domain: Positive constant; no tides, rotation or self gravity.
- id: planetlib.escape.parker.quantity.r_s
  revision: '1'
  latex: r_s
  description: Regular sonic radius at which v=a on the selected branch.
  unit: cm
  domain: Positive radius of the smooth isothermal transonic critical point.
- id: planetlib.escape.parker.quantity.slope
  revision: '1'
  latex: v'_s
  description: Radial velocity derivative at the sonic point.
  unit: s^-1
  domain: The accelerating branch selects the positive regular root.
equations:
- id: planetlib.escape.parker.continuity
  revision: '1'
  description: Constant spherical mass loss.
  scope: The same density and velocity occur in the pressure and momentum equations.
  symbols:
    mdot: {latex: \dot M, description: Total outward mass flow through a sphere., unit: g s^-1}
    r: {latex: r, description: Radius from the point-mass center., unit: cm}
    rho: {latex: \rho, description: Total material mass density., unit: g cm^-3}
    v: {latex: v, description: Outward radial material velocity., unit: cm s^-1}
  assumptions: &id002
  - Steady spherical single-fluid flow, constant positive isothermal sound speed and mean molecular weight, fixed
    point-mass gravity, and positive density/velocity.
  - No tides, rotation, viscosity, radiation-pressure force or distributed mass source is included; symbols denote
    numerical magnitudes in the declared cgs units.
  - The sonic radius and slope require a smooth transonic solution. The positive slope selects the accelerating
    wind, while the local algebra also admits a negative regular slope.
  - Boundary conditions, mass-loss selection, global existence, numerical branch finding and temperature/ionization
    closure are not supplied.
  evidence:
  - planetlib.escape.parker.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''mdot'', positive=True), Mul(Integer(4), pi, Pow(Symbol(''r'',
      positive=True), Integer(2)), Function(''rho'')(Symbol(''r'', positive=True)), Function(''v'')(Symbol(''r'',
      positive=True))))'}
- id: planetlib.escape.parker.isothermal_pressure
  revision: '1'
  description: Gas pressure for the fixed isothermal sound speed.
  scope: a is spatially constant; using a variable a would add its radial derivative to the reduced equation.
  symbols:
    P: {latex: P, description: Gas pressure supporting the isothermal flow., unit: erg cm^-3}
    a: {latex: a, description: Constant isothermal sound speed with fixed temperature and mean molecular weight.,
      unit: cm s^-1}
    r: {latex: r, description: Radius from the point-mass center., unit: cm}
    rho: {latex: \rho, description: Total material mass density., unit: g cm^-3}
  assumptions: *id002
  evidence:
  - planetlib.escape.parker.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Function(''P'')(Symbol(''r'', positive=True)), Mul(Pow(Symbol(''a'',
      positive=True), Integer(2)), Function(''rho'')(Symbol(''r'', positive=True))))'}
- id: planetlib.escape.parker.momentum
  revision: '1'
  description: Radial momentum balance in point-mass gravity.
  scope: Smooth positive density and velocity on a finite radial interval.
  symbols:
    P: {latex: P, description: Gas pressure supporting the isothermal flow., unit: erg cm^-3}
    gm: {latex: GM, description: Point-mass gravitational parameter., unit: cm^3 s^-2}
    r: {latex: r, description: Radius from the point-mass center., unit: cm}
    rho: {latex: \rho, description: Total material mass density., unit: g cm^-3}
    v: {latex: v, description: Outward radial material velocity., unit: cm s^-1}
  assumptions: *id002
  evidence:
  - planetlib.escape.parker.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Mul(Function(''v'')(Symbol(''r'', positive=True)), Derivative(Function(''v'')(Symbol(''r'',
      positive=True)), Tuple(Symbol(''r'', positive=True), Integer(1)))), Add(Mul(Integer(-1), Symbol(''gm'', positive=True),
      Pow(Symbol(''r'', positive=True), Integer(-2))), Mul(Integer(-1), Pow(Function(''rho'')(Symbol(''r'', positive=True)),
      Integer(-1)), Derivative(Function(''P'')(Symbol(''r'', positive=True)), Tuple(Symbol(''r'', positive=True),
      Integer(1))))))'}
- id: planetlib.escape.parker.reduced_wind
  revision: '1'
  description: Eliminate the density gradient using continuity and the isothermal pressure law.
  scope: Valid away from singular branches; the sonic point requires the separate regularity conditions.
  symbols:
    a: {latex: a, description: Constant isothermal sound speed with fixed temperature and mean molecular weight.,
      unit: cm s^-1}
    gm: {latex: GM, description: Point-mass gravitational parameter., unit: cm^3 s^-2}
    r: {latex: r, description: Radius from the point-mass center., unit: cm}
    v: {latex: v, description: Outward radial material velocity., unit: cm s^-1}
  assumptions: *id002
  evidence:
  - planetlib.escape.parker.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Mul(Add(Mul(Integer(-1), Pow(Symbol(''a'', positive=True),
      Integer(2)), Pow(Function(''v'')(Symbol(''r'', positive=True)), Integer(-1))), Function(''v'')(Symbol(''r'',
      positive=True))), Derivative(Function(''v'')(Symbol(''r'', positive=True)), Tuple(Symbol(''r'', positive=True),
      Integer(1)))), Add(Mul(Integer(2), Pow(Symbol(''a'', positive=True), Integer(2)), Pow(Symbol(''r'', positive=True),
      Integer(-1))), Mul(Integer(-1), Symbol(''gm'', positive=True), Pow(Symbol(''r'', positive=True), Integer(-2)))))'}
- id: planetlib.escape.parker.sonic_radius
  revision: '1'
  description: Locate the regular critical radius for v=a.
  scope: The numerator and coefficient of v-prime vanish together.
  symbols:
    a: {latex: a, description: Constant isothermal sound speed with fixed temperature and mean molecular weight.,
      unit: cm s^-1}
    gm: {latex: GM, description: Point-mass gravitational parameter., unit: cm^3 s^-2}
    r_s: {latex: r_s, description: Regular sonic radius at which v=a on the selected branch., unit: cm}
  assumptions: *id002
  evidence:
  - planetlib.escape.parker.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''r_s'', positive=True), Mul(Rational(1, 2), Pow(Symbol(''a'',
      positive=True), Integer(-2)), Symbol(''gm'', positive=True)))'}
- id: planetlib.escape.parker.accelerating_slope
  revision: '1'
  description: Select the positive regular sonic slope.
  scope: Differentiate the reduced equation at the smooth critical point; the negative root belongs to a different
    local branch.
  symbols:
    a: {latex: a, description: Constant isothermal sound speed with fixed temperature and mean molecular weight.,
      unit: cm s^-1}
    r_s: {latex: r_s, description: Regular sonic radius at which v=a on the selected branch., unit: cm}
    slope: {latex: v'_s, description: Radial velocity derivative at the sonic point., unit: s^-1}
  assumptions: *id002
  evidence:
  - planetlib.escape.parker.upstream
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''slope'', real=True), Mul(Symbol(''a'', positive=True),
      Pow(Symbol(''r_s'', positive=True), Integer(-1))))'}
mathematical_models:
- id: planetlib.escape.parker.isothermal_wind
  revision: '1'
  description: Open isothermal point-mass wind model.
