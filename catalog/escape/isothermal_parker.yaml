    slope: {quantity: {id: planetlib.escape.parker.quantity.slope, revision: '1'}, role: derived}
    v: {quantity: {id: planetlib.escape.parker.quantity.v, revision: '1'}, role: unknown}
  relations:
  - id: planetlib.escape.parker.isothermal_wind.continuity
    equation: {id: planetlib.escape.parker.continuity, revision: '1'}
    role: Mass conservation
    quantities:
      mdot: mdot
      r: r
      rho: rho
      v: v
  - id: planetlib.escape.parker.isothermal_wind.isothermal_pressure
    equation: {id: planetlib.escape.parker.isothermal_pressure, revision: '1'}
    role: Isothermal equation of state
    quantities:
      P: P
      a: a
      r: r
      rho: rho
  - id: planetlib.escape.parker.isothermal_wind.momentum
    equation: {id: planetlib.escape.parker.momentum, revision: '1'}
    role: Momentum conservation
    quantities:
      P: P
      gm: gm
      r: r
      rho: rho
      v: v
  - id: planetlib.escape.parker.isothermal_wind.reduced_wind
    equation: {id: planetlib.escape.parker.reduced_wind, revision: '1'}
    role: Derived wind equation
    quantities:
      a: a
      gm: gm
      r: r
      v: v
  - id: planetlib.escape.parker.isothermal_wind.sonic_radius
    equation: {id: planetlib.escape.parker.sonic_radius, revision: '1'}
    role: Sonic regularity
    quantities: {a: a, gm: gm, r_s: r_s}
  - id: planetlib.escape.parker.isothermal_wind.accelerating_slope
    equation: {id: planetlib.escape.parker.accelerating_slope, revision: '1'}
    role: Accelerating branch choice
    quantities: {a: a, r_s: r_s, slope: slope}
