assumptions:
- statement: Steady spherical single-fluid flow, constant positive isothermal sound speed and mean molecular weight,
    fixed point-mass gravity, and positive density/velocity.
  evidence:
  - planetlib.escape.parker.upstream
- statement: No tides, rotation, viscosity, radiation-pressure force or distributed mass source is included; symbols
    denote numerical magnitudes in the declared cgs units.
  evidence:
  - planetlib.escape.parker.upstream
- statement: The sonic radius and slope require a smooth transonic solution. The positive slope selects the accelerating
    wind, while the local algebra also admits a negative regular slope.
  evidence:
  - planetlib.escape.parker.upstream
- statement: Boundary conditions, mass-loss selection, global existence, numerical branch finding and temperature/ionization
