schema_version: '0.6'
model:
  id: planetlib.atmosphere.columns
  name: Atmospheric absorber columns and optical depth
  description: Local cgs absorber-column relations with positive gravity and particle masses. Pressure differences
    are in dyn cm^-2, not bar. Pressure-column formulas assume constant composition and gravity over the pressure
    interval. The separate differential hydrostatic relation allows inverse-square gravity; integrating a finite
    atmosphere still requires thermal/composition profiles and a boundary.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/atmosphere/columns.yaml
assumptions:
- statement: Cross section is per absorbing particle; mass mixing ratio is absorber mass divided by total gas mass,
    whereas volume mixing ratio is absorber number divided by total gas particle number.
  evidence:
  - planetlib.atmosphere.columns.source
- statement: CIA coefficient k_cia is defined by alpha=k_cia*n1*n2. Its supplied convention already accounts for
    identical partners; no additional factor 1/2 is applied.
  evidence:
  - planetlib.atmosphere.columns.source
- statement: The pressure-column approximation and the differential inverse-square hydrostatic relation are distinct
    relations, not a claim that finite layers have exactly constant gravity. The scalar m_mean is the selected layer
    value of the separately supplied radial mean-mass field m_mean_r.
  evidence:
  - planetlib.atmosphere.columns.source
domains:
- kind: scientific_applicability
  status: unknown
  description: The definition is a conditional partial model, with no adopted empirical validation.
  conditions: []
  evidence:
  - planetlib.atmosphere.columns.source
limitations:
- statement: Local cgs absorber-column relations with positive gravity and particle masses. Pressure differences
    are in dyn cm^-2, not bar. Pressure-column formulas assume constant composition and gravity over the pressure
    interval. The separate differential hydrostatic relation allows inverse-square gravity; integrating a finite
    atmosphere still requires thermal/composition profiles and a boundary.
  evidence:
  - planetlib.atmosphere.columns.source
- statement: Numerical algorithms, fitted data, discretization choices and floating-point accuracy remain provider
    responsibilities.
  evidence:
  - planetlib.atmosphere.columns.source
claims:
- id: planetlib.atmosphere.columns.mathematical_consistency
  revision: '1'
  kind: theoretical
  statement: Mass- and volume-based columns agree under the explicit mixing conversion; CIA vanishes at zero path
    or either zero density; isothermal inverse-square hydrostatic balance has the stated differential consequence.
  scope: Conditional mathematical checks only; neither provider equivalence nor physical applicability is inferred.
  mathematical_models:
  - id: planetlib.atmosphere.columns.model
    revision: '1'
- id: planetlib.atmosphere.columns.source_correspondence
  revision: '1'
  kind: theoretical
  statement: The shared definitions preserve the selected conventions of the inspected implementation.
  scope: The source supplied the extraction target; a separate correspondence review is required.
  mathematical_models:
  - id: planetlib.atmosphere.columns.model
    revision: '1'
- id: planetlib.atmosphere.columns.physical_applicability
  revision: '1'
  kind: physical_validation
  statement: The selected relations have adequate accuracy for a specified physical target.
  scope: No target, empirical error criterion or independent observation is selected by this library entry.
  mathematical_models:
  - id: planetlib.atmosphere.columns.model
    revision: '1'
evidence:
- id: planetlib.atmosphere.columns.source
  kind: implementation
  summary: Mathematical conventions extracted from immutable ExoJAX source.
  sources:
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/rt/layeropacity.py
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/atm/atmprof.py
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/atm/idealgas.py
  scope: The cited source implementations were inspected. This is not a new inspection of their original literature
    or a transferred provider assessment.
  provenance:
    role: implementation
    location: The functions and conventions identified by the immutable source paths.
    inspection: inspected
    note: Shared mathematical definitions are distinct from numerical approximation and physical applicability.
