    water_pressure: {quantity: {id: planetlib.solubility.sun_yao2026.water_partial_pressure, revision: '1'}, role: input}
    sodium_fraction: {quantity: {id: planetlib.solubility.sun_yao2026.dry_na2o_mole_fraction, revision: '1'}, role: input}
    aluminium_fraction: {quantity: {id: planetlib.solubility.sun_yao2026.dry_al2o3_mole_fraction, revision: '1'},
      role: input}
    water_fraction: {quantity: {id: planetlib.solubility.sun_yao2026.binary_water_mass_fraction, revision: '1'},
      role: derived}
  relations:
  - id: planetlib.solubility.sun_yao2026.solubility
    equation: {id: planetlib.solubility.sun_yao2026.water_mass_fraction, revision: '2'}
    role: Empirical water relation on the selected mass basis
    quantities:
