  - https://github.com/HajimeKawahara/exogibbs/blob/08d3d85a6680eb81c4057bf584530d269de88253/mceg/contracts/h2o_sun_yao2026.yaml
  scope: Source SHA256 965fc7ef776b4b93000b149177f38070b86720d1668c586f67878fcf68726eeb; contract SHA256 c1a94e3e111e6e992b31c80eb6b36aad9558381bf56fa8ecdd2188b1081363b1.
    The source follows MAGEMin_C.jl commit 47e2d12bfec0f799acf030b285fa3b1e8eb32098. No numerical provider was imported
    or executed for this extraction.
  provenance:
    role: implementation
    location: h2o_sun_yao2026_terms, h2o_sun_yao2026 and the _A coefficient tuple.
    inspection: inspected
    note: Source conventions are recorded; reading code is not numerical or empirical validation.
- id: planetlib.solubility.sun_yao2026.provider_snapshot
  kind: implementation
  summary: Historical provider review retained by the ExoInventory consumer.
  sources:
  - https://github.com/HajimeKawahara/exoinventory/blob/02540ee13cfb847ade632b35e9c8d950795dc5f0/examples/subneptune_taxonomy/finite_melt/mceg/provider_reviews/h2o_sun_yao2026.yaml
