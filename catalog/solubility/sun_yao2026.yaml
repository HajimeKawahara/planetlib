  scope: Snapshot SHA256 becaf73f32e226915d753186a4ac3ed0398fee2a8e37e0d7d45e007e582eab8f, provider contract revision
    06d26e1fd11fb22181965988c170d63a4c5a9ab6. Subject survey_20261020 and Context source_review_environment_20261021
    select source_formula_review_20261021 (supported, four positive-interior scalar comparisons) and physical_source_review_20261021
    (unknown). The adopted source revision is 1f868eab28c7d71aac613645a264cfd4417709be. The current contract relocates
    archived evidence paths; its bytes are distinct from this snapshot.
- id: planetlib.solubility.sun_yao2026.paper_review
  kind: literature
  summary: ExoInventory's later static comparison with Sun and Yao (2026), Eq. 7 and Table 1.
  sources:
  - https://doi.org/10.1016/j.epsl.2026.120115
  - https://github.com/HajimeKawahara/exoinventory/blob/02540ee13cfb847ade632b35e9c8d950795dc5f0/examples/subneptune_taxonomy/finite_melt/mceg/sun_yao_paper.md
  - https://github.com/HajimeKawahara/exoinventory/blob/02540ee13cfb847ade632b35e9c8d950795dc5f0/examples/subneptune_taxonomy/finite_melt/validation/20261029_sun_yao_paper/review.json
  - https://github.com/HajimeKawahara/exoinventory/blob/02540ee13cfb847ade632b35e9c8d950795dc5f0/examples/subneptune_taxonomy/finite_melt/mceg/s1_adopted.yaml
  scope: Context sun-yao-paper-review-20261029 records paper:water-formula as supported for static Eq. 7/Table 1
    agreement and paper:empirical-transfer as unknown. The review distinguishes partial pressure from fugacity and
    leaves binary denominator, iron-redox convention and multisolute continuation as consumer choices. The paper's
    parameter uncertainties supply no covariance matrix or target-host error bound. This evidence points to that
    review, not a new assessment. The 60000 bar upper bound belongs to the combined H2O-CO2 dataset; the reviewed
    water experiments reach 20000 bar. Neither range is a joint calibration box.
  provenance:
    role: secondary
    location: The committed original-paper review and receipt in ExoInventory.
    inspection: inspected
    note: The historical review's conclusions remain scoped to its original records.
