schema_version: '0.6'
model:
  id: planetlib.solubility.sun_yao2026.catalog
  name: Sun-Yao water solubility on a binary dry-host/water basis
  description: A partial-pressure-specific definition with explicit concentration and oxide denominators.
  implementation:
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:2
    entry_points:
    - catalog/solubility/sun_yao2026.yaml
assumptions:
- statement: The driving quantity is water partial pressure. The fitted composite terms already absorb fluid nonideality;
    replacing partial pressure by fugacity defines a different relation.
  evidence:
  - planetlib.solubility.sun_yao2026.paper_review
- statement: The adopted concentration denominator is dry-host mass plus dissolved H2O-equivalent mass. Molecular
    water and hydroxyl contributions share this denominator; hydroxyl supplies no additional hydrogen inventory.
  evidence:
  - planetlib.solubility.sun_yao2026.provider_source
domains:
- kind: numerical_evaluation
  status: documented
  description: Mathematical evaluation domain of this definition, not a calibration domain.
  conditions:
  - T > 0, P > 0, and 0 <= p_H2O <= P; all inputs are finite.
  - x_Na2O >= 0, x_Al2O3 >= 0, and x_Na2O + x_Al2O3 <= 1.
  - The predicted mass fraction must satisfy 0 <= w < 1 for the stated binary mass interpretation.
  - At p_H2O = 0 the continuous extension is w = 0; the pressure derivative is singular.
  evidence:
  - planetlib.solubility.sun_yao2026.provider_source
- kind: scientific_applicability
  status: unknown
  description: Joint composition, temperature, pressure and fluid-specific accuracy requires separate evaluation.
  conditions: []
  evidence:
  - planetlib.solubility.sun_yao2026.paper_review
limitations:
- statement: The binary mass basis is an explicit provider convention. Additional dissolved H2, He or CO2 require
    a separate mass convention and thermodynamic continuation. This relation supplies neither a Gibbs scalar nor
    host chemical potentials.
  evidence:
  - planetlib.solubility.sun_yao2026.provider_source
  - planetlib.solubility.sun_yao2026.paper_review
- statement: The combined H2O-CO2 compilation's 60000 bar upper limit is not a water-only calibration box. The consumer
    review reports water experiments up to 20000 bar; marginal ranges and pooled errors establish no target-host
    error bound.
  evidence:
  - planetlib.solubility.sun_yao2026.paper_review
- statement: Earlier provider assessments and the later consumer paper review retain their original Subjects and
    Contexts. Their support is not transferred to this extracted definition or to a new coupled model.
  evidence:
  - planetlib.solubility.sun_yao2026.provider_snapshot
  - planetlib.solubility.sun_yao2026.paper_review
claims:
- id: planetlib.solubility.sun_yao2026.definition_correspondence
  revision: '2'
  kind: theoretical
  statement: The extracted relation preserves the selected source formula and the explicitly adopted binary mass
    convention.
  scope: Definition correspondence only; no implementation equivalence, experimental transfer or thermodynamic closure
    is asserted.
  equations:
  - {id: planetlib.solubility.sun_yao2026.water_mass_fraction, revision: '2'}
  mathematical_models:
  - {id: planetlib.solubility.sun_yao2026.binary_water, revision: '2'}
- id: planetlib.solubility.sun_yao2026.definition_correspondence
  revision: '1'
  kind: theoretical
  statement: The extracted relation preserves the selected source formula and the explicitly adopted binary mass
    convention.
  scope: Definition correspondence only; no implementation equivalence, experimental transfer or thermodynamic closure
    is asserted.
  equations:
  - {id: planetlib.solubility.sun_yao2026.water_mass_fraction, revision: '1'}
  mathematical_models:
  - {id: planetlib.solubility.sun_yao2026.binary_water, revision: '1'}
evidence:
- id: planetlib.solubility.sun_yao2026.provider_source
  kind: implementation
  summary: ExoGibbs source and current provider contract, inspected as extraction inputs.
  sources:
