quantities:
- id: planetlib.solubility.sun_yao2026.temperature
  revision: '1'
  latex: T
  description: Absolute temperature of the equilibrated melt and fluid.
  unit: K
  domain: Finite T > 0.
- id: planetlib.solubility.sun_yao2026.melt_total_pressure
  revision: '1'
  latex: P
  description: Total pressure at the melt-fluid interface, distinct from water partial pressure.
  unit: bar
  domain: Finite P > 0.
- id: planetlib.solubility.sun_yao2026.water_partial_pressure
  revision: '1'
  latex: p_{H_2O}
  description: Water partial pressure in the fluid; this quantity is not water fugacity.
  unit: bar
  domain: Finite 0 <= p_H2O <= P.
- id: planetlib.solubility.sun_yao2026.dry_na2o_mole_fraction
  revision: '1'
  latex: X_{Na_2O}
  description: Na2O formula-unit moles divided by the sum of all volatile-free oxide formula-unit moles; Na and
    Al are not renormalized alone.
  unit: '1'
  domain: Nonnegative fraction of a fully specified dry oxide inventory; the caller declares iron-redox normalization.
- id: planetlib.solubility.sun_yao2026.dry_al2o3_mole_fraction
  revision: '1'
  latex: X_{Al_2O_3}
  description: Al2O3 formula-unit moles divided by the same complete volatile-free oxide mole inventory as X_Na2O.
  unit: '1'
  domain: Nonnegative fraction with X_Na2O + X_Al2O3 <= 1; the caller declares iron-redox normalization.
- id: planetlib.solubility.sun_yao2026.binary_water_mass_fraction
  revision: '1'
  latex: w
  description: Total dissolved H2O-equivalent mass divided by dry-host mass plus that H2O-equivalent mass; molecular
    water and hydroxyl are already combined.
  unit: '1'
  domain: 0 <= w < 1 on the binary dry-host/water basis; extra dissolved species require a new convention.
equations:
- id: planetlib.solubility.sun_yao2026.water_mass_fraction
  revision: '2'
  description: Two pressure powers for molecular water and hydroxyl, with the ten published water coefficients and
    one wt%-to-mass-fraction conversion.
  scope: Sun-Yao Eq. 7/Table 1 evaluated with T in K and both pressures in bar, restricted here to the explicit
    binary dry-host/water mass convention. Fixed coefficient precision follows the inspected source and consumer
    review.
  symbols:
    T: {latex: T, description: Melt-fluid temperature, unit: K}
    P: {latex: P, description: Total melt pressure, unit: bar}
    p_H2O: {latex: 'p_{H_2O}', description: Fluid water partial pressure, unit: bar}
    x_Na2O: {latex: 'X_{Na_2O}', description: Complete dry-oxide-basis Na2O mole fraction, unit: '1'}
    x_Al2O3: {latex: 'X_{Al_2O_3}', description: Complete dry-oxide-basis Al2O3 mole fraction, unit: '1'}
    w: {latex: w, description: Binary dissolved H2O-equivalent mass fraction, unit: '1'}
  assumptions:
  - Pressure and temperature occur as numerical values in the specified units; changing units requires these normalizations.
  - Water partial pressure is not replaced by fugacity.
  - The complete dry oxide denominator and its iron-redox convention are supplied externally.
  - The two terms use the same H2O-equivalent mass basis; no separate hydroxyl hydrogen budget is added.
  - At zero water partial pressure the continuous extension is w=0, with a singular pressure derivative.
  - 'SymPy symbols are numerical magnitudes: T in K, P and p_H2O in bar, and mole/mass fractions dimensionless.'
  evidence:
  - planetlib.solubility.sun_yao2026.provider_source
  - planetlib.solubility.sun_yao2026.paper_review
  sympy: {format: sympy-srepr-v1, expression: 'Equality(Symbol(''w''), Add(Mul(Rational(1, 100), Pow(Symbol(''T''),
      Rational(-43771, 62500)), Pow(Symbol(''p_H2O''), Rational(161561, 200000)), exp(Add(Mul(Integer(-1), Rational(74546597,
      1000000), Pow(Symbol(''P''), Rational(1, 2)), Pow(Symbol(''T''), Integer(-1)), Symbol(''x_Na2O'')), Mul(Rational(2949559,
      1000000000000), Pow(Symbol(''P''), Integer(2)), Pow(Symbol(''T''), Integer(-1))), Mul(Rational(1786568863,
      250000), Pow(Symbol(''T''), Integer(-1)), Symbol(''x_Na2O''))))), Mul(Rational(1, 100), Pow(Symbol(''T''),
      Rational(-180097, 500000)), Pow(Symbol(''p_H2O''), Rational(449387, 1000000)), exp(Mul(Symbol(''P''), Pow(Symbol(''T''),
      Integer(-1)), Add(Mul(Rational(2984703, 1000000), Symbol(''x_Al2O3'')), Mul(Integer(-1), Rational(169371,
      100000), Symbol(''x_Na2O'')), Rational(-308259, 1000000)))))))'}
- id: planetlib.solubility.sun_yao2026.water_mass_fraction
  revision: '1'
  latex: w=\frac{1}{100}\left[ \left(\frac{p_{H_2O}}{1\,\mathrm{bar}}\right)^{0.807805} \left(\frac{T}{1\,\mathrm{K}}\right)^{-0.700336}
    \exp\!\left(2.949559\times10^{-6}\frac{(P/(1\,\mathrm{bar}))^2}{T/(1\,\mathrm{K})} +\frac{(-74.546597\sqrt{P/(1\,\mathrm{bar})}+7146.275452)X_{Na_2O}}{T/(1\,\mathrm{K})}\right)
    +\left(\frac{p_{H_2O}}{1\,\mathrm{bar}}\right)^{0.449387} \left(\frac{T}{1\,\mathrm{K}}\right)^{-0.360194} \exp\!\left(\frac{(-0.308259+2.984703X_{Al_2O_3}-1.693710X_{Na_2O})(P/(1\,\mathrm{bar}))}{T/(1\,\mathrm{K})}\right)
    \right]
  description: Two pressure powers for molecular water and hydroxyl, with the ten published water coefficients and
    one wt%-to-mass-fraction conversion.
  scope: Sun-Yao Eq. 7/Table 1 evaluated with T in K and both pressures in bar, restricted here to the explicit
    binary dry-host/water mass convention. Fixed coefficient precision follows the inspected source and consumer
    review.
  symbols:
    T: {latex: T, description: Melt-fluid temperature, unit: K}
    P: {latex: P, description: Total melt pressure, unit: bar}
    p_H2O: {latex: 'p_{H_2O}', description: Fluid water partial pressure, unit: bar}
    x_Na2O: {latex: 'X_{Na_2O}', description: Complete dry-oxide-basis Na2O mole fraction, unit: '1'}
    x_Al2O3: {latex: 'X_{Al_2O_3}', description: Complete dry-oxide-basis Al2O3 mole fraction, unit: '1'}
    w: {latex: w, description: Binary dissolved H2O-equivalent mass fraction, unit: '1'}
  assumptions:
  - Pressure and temperature occur as numerical values in the specified units; changing units requires these normalizations.
  - Water partial pressure is not replaced by fugacity.
  - The complete dry oxide denominator and its iron-redox convention are supplied externally.
  - The two terms use the same H2O-equivalent mass basis; no separate hydroxyl hydrogen budget is added.
  - At zero water partial pressure the continuous extension is w=0, with a singular pressure derivative.
  evidence:
  - planetlib.solubility.sun_yao2026.provider_source
  - planetlib.solubility.sun_yao2026.paper_review
mathematical_models:
