schema_version: '0.6'
model:
  id: planetlib.solubility.hirschmann2012
  name: Hirschmann basalt hydrogen regression and endmember variant
  description: Shared regression constants with explicitly different dissolved-hydrogen concentration bases.
  implementation:
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:2
    entry_points:
    - catalog/solubility/hirschmann2012.yaml
assumptions:
- statement: Molecular H2 fugacity in bar and melt total pressure in GPa are distinct inputs; neither is substituted
    for the other.
  evidence:
  - planetlib.solubility.hirschmann2012.upstream_review
- statement: The endmember variant describes the ExoEOS equilibrium concentration at zero additional H2 standard-state
    offset.
  evidence:
  - planetlib.solubility.hirschmann2012.provider
domains:
- kind: numerical_evaluation
  status: documented
  description: Algebraic domain of the recorded logarithmic relations.
  conditions:
  - Positive fugacity
  - positive melt pressure
  - and a molecular H2 mole fraction strictly between zero and one.
  evidence:
  - planetlib.solubility.hirschmann2012.definition
- kind: scientific_applicability
  status: unknown
  description: No new source replay or physical transfer assessment is supplied by this extraction.
  conditions: []
  evidence:
  - planetlib.solubility.hirschmann2012.upstream_review
limitations:
- statement: The oxide denominator is the explicit reconstruction used by the ExoEOS review; exact reproduction
    of the authors' unpublished normalization remains unresolved.
  evidence:
  - planetlib.solubility.hirschmann2012.upstream_review
- statement: Basalt experiments span 1673.15 to 1723.15 K and 0.7 to 3 GPa as marginal bounds, not a validated joint
    rectangle. The pressure regression supplies no calibrated temperature law.
  evidence:
  - planetlib.solubility.hirschmann2012.upstream_review
- statement: One mole of Mg2SiO4 counts as three dry oxide moles but one MELTS endmember mole. Identical coefficients
    and dimensionless units do not make the two concentration definitions equivalent; no correction or refit is
    provided.
  evidence:
  - planetlib.solubility.hirschmann2012.upstream_review
- statement: The full extensive Gibbs scalar, its host derivatives, gas standards and nonzero H2 offsets remain
    provider choices outside these regression models.
  evidence:
  - planetlib.solubility.hirschmann2012.provider
claims:
- id: planetlib.solubility.hirschmann2012.source_correspondence
  revision: '2'
  kind: theoretical
  statement: The extracted definitions preserve the regression and concentration distinctions documented in the
    pinned ExoEOS review.
  scope: A proposed transcription awaiting a separate review; this is not a new inspection of the original paper
    or a proof of provider correspondence.
  mathematical_models:
  - {id: planetlib.solubility.hirschmann2012.oxide_model, revision: '2'}
  - {id: planetlib.solubility.hirschmann2012.endmember_model, revision: '2'}
- id: planetlib.solubility.hirschmann2012.physical_transfer
  revision: '2'
  kind: physical_validation
  statement: The selected concentration variant has established physical accuracy for a consumer's target melt and
    conditions.
  scope: Requires a specified host, gas model and independent empirical comparison; none is supplied here.
  mathematical_models:
  - {id: planetlib.solubility.hirschmann2012.oxide_model, revision: '2'}
  - {id: planetlib.solubility.hirschmann2012.endmember_model, revision: '2'}
- id: planetlib.solubility.hirschmann2012.source_correspondence
  revision: '1'
  kind: theoretical
  statement: The extracted definitions preserve the regression and concentration distinctions documented in the
    pinned ExoEOS review.
  scope: A proposed transcription awaiting a separate review; this is not a new inspection of the original paper
    or a proof of provider correspondence.
  mathematical_models:
  - {id: planetlib.solubility.hirschmann2012.oxide_model, revision: '1'}
  - {id: planetlib.solubility.hirschmann2012.endmember_model, revision: '1'}
- id: planetlib.solubility.hirschmann2012.physical_transfer
  revision: '1'
  kind: physical_validation
  statement: The selected concentration variant has established physical accuracy for a consumer's target melt and
    conditions.
  scope: Requires a specified host, gas model and independent empirical comparison; none is supplied here.
  mathematical_models:
  - {id: planetlib.solubility.hirschmann2012.oxide_model, revision: '1'}
  - {id: planetlib.solubility.hirschmann2012.endmember_model, revision: '1'}
evidence:
- id: planetlib.solubility.hirschmann2012.paper
  kind: literature
  summary: Hirschmann et al. (2012), molecular hydrogen solubility in silicate melts.
  sources:
  - https://doi.org/10.1016/j.epsl.2012.06.031
  scope: Bibliographic origin recorded by ExoEOS; the original paper was not inspected anew for this extraction.
  provenance:
    role: primary
    location: Fig. 4 basalt regression, Table 2 concentration convention and Eq. 6.
    inspection: not_inspected
    note: Original-source review remains attributed to the dated ExoEOS records below.
- id: planetlib.solubility.hirschmann2012.upstream_review
  kind: literature
  summary: Pinned ExoEOS coefficient, concentration-basis and supplementary-data reviews.
  sources:
  - https://github.com/HajimeKawahara/exoeos/blob/1032f58872bdef9d48c8b1ce2a16a473ced97f3c/mceg/contracts/magma_volatiles.yaml
  - https://github.com/HajimeKawahara/exoeos/blob/1032f58872bdef9d48c8b1ce2a16a473ced97f3c/results/mceg/20261029_source_review/review.json
  - https://github.com/HajimeKawahara/exoeos/blob/1032f58872bdef9d48c8b1ce2a16a473ced97f3c/results/mceg/20261029_remaining_source_review/review.json
  scope: The review records -11.403 and -0.76 per GPa for basalt, fugacity in bar, and oxide versus MELTS endmember
    counting. Its five matched-run oxide reconstructions leave ln K residuals from -0.091864 to +0.018066. Supplement
    B808 is not silently identified with main-paper A808. Historical physical assessments remain unknown. Basalt
    experiment bounds of 1673.15 to 1723.15 K and 0.7 to 3 GPa are marginal ranges, not a joint validation rectangle;
    the fit has no calibrated temperature law.
  provenance:
    role: secondary
    location: hirschmann2012_20261029, h2_basis_comparison_20261029, hirschmann_supplement_20261029 and the associated
      review JSON records.
    inspection: inspected
    note: Local files at the pinned clean checkout were read; historical source inspections and assessments are
      not reassigned to Planetlib.
    derived_from:
    - {evidence: planetlib.solubility.hirschmann2012.paper, comparison: not_checked, note: The original PDF and
        supplementary document were not re-inspected here.}
- id: planetlib.solubility.hirschmann2012.provider
  kind: implementation
  summary: ExoEOS adds molecular-H2 dilution to a dry MELTS endmember plus water host.
  sources:
  - https://github.com/HajimeKawahara/exoeos/blob/1032f58872bdef9d48c8b1ce2a16a473ced97f3c/src/exoeos/magma_volatiles.py
  scope: gibbs_j uses host=sum(dry)+water and an H2 standard offset 11.403+0.76*P_Pa/1e9+h2_offset_rt. Differentiating
    its H2 dilution contribution yields ln(n_H2/(host+n_H2)). The recorded regression variant selects h2_offset_rt=0
    and a common one-bar gas standard.
  provenance:
    role: implementation
    location: src/exoeos/magma_volatiles.py, gibbs_j, H2 contribution.
    inspection: inspected
    note: Code inspection only; no provider execution, empirical replay or new EquationBinding validation.
- id: planetlib.solubility.hirschmann2012.definition
  kind: theory
  summary: Authored extraction retaining two distinct concentration definitions.
  sources:
  - catalog/solubility/hirschmann2012.yaml
  scope: Definition only; an algebraic record does not establish experimental applicability.
subjects:
- id: planetlib.solubility.hirschmann2012.definition_subject
  implementation:
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/solubility/hirschmann2012.yaml
  selected_files: {catalog/solubility/hirschmann2012.yaml: null}
- id: planetlib.solubility.hirschmann2012.definition_subject.symbolic_v2
  implementation:
