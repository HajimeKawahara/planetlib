    entry_points:
    - catalog/solubility/hirschmann2012.yaml
  selected_files: {catalog/solubility/hirschmann2012.yaml: null}
contexts:
- id: planetlib.solubility.hirschmann2012.extraction_context
  scope: Initial extraction from pinned local ExoEOS records, with no new original-source or numerical validation.
  settings: {extraction_date: '2026-11-27'}
quantities:
- id: planetlib.solubility.hirschmann2012.melt_pressure
  revision: '1'
  latex: P
  description: Total mechanical pressure of the melt; separate from hydrogen fugacity.
  unit: GPa
  domain: Positive melt pressure supplied by the consumer.
- id: planetlib.solubility.hirschmann2012.hydrogen_fugacity
  revision: '1'
  latex: f_{\mathrm{H_2}}
  description: Molecular hydrogen gas fugacity, with the regression using f_H2 divided by one bar.
  unit: bar
  domain: Positive fugacity supplied by a separately selected gas model.
- id: planetlib.solubility.hirschmann2012.oxide_fraction
  revision: '1'
  latex: X_{\mathrm{H_2}}^{\mathrm{ox}}=n_{\mathrm{H_2}}/(N_{\mathrm{dry,ox}}+n_{\mathrm{H_2O}}+n_{\mathrm{H_2}})
  description: Molecular H2 amount divided by total dry oxide component, H2O-equivalent and molecular H2 amounts.
    H2O includes dissolved water and OH expressed as H2O. This is the review's declared source reconstruction, not
    exact recovery of the authors' arithmetic.
  unit: '1'
  domain: A positive dry oxide host and a molecular H2 fraction strictly between zero and one; other guests are
    excluded.
- id: planetlib.solubility.hirschmann2012.endmember_fraction
  revision: '1'
  latex: X_{\mathrm{H_2}}^{\mathrm{em}}=n_{\mathrm{H_2}}/(N_{\mathrm{dry,em}}+n_{\mathrm{H_2O}}+n_{\mathrm{H_2}})
  description: Molecular H2 amount divided by total dry MELTS endmember, H2O and molecular H2 amounts. The dry-host
    sum counts each MELTS endmember amount once, rather than its oxide stoichiometric count.
  unit: '1'
  domain: The ExoEOS dry11 plus water host, excluding helium from this denominator; fraction strictly between zero
    and one.
equations:
- id: planetlib.solubility.hirschmann2012.oxide_regression
  revision: '2'
  description: Basalt Fig. 4 pressure regression using the reviewed oxide-based concentration reconstruction.
  scope: Paper coefficient values and oxide-component meaning retained with the unresolved normalization caveat.
  symbols:
    X: {latex: X, description: Molecular H2 fraction on the reconstructed oxide-plus-water-plus-H2 basis., unit: '1'}
    f: {latex: f, description: Molecular hydrogen fugacity., unit: bar}
    P: {latex: P, description: Melt total pressure., unit: GPa}
  assumptions:
  - No fitted temperature dependence is added.
  - The two pressure quantities retain their separate physical meanings.
  - 'SymPy symbols are numerical magnitudes: P in GPa, f in bar, and X dimensionless; log(X/f) uses fugacity divided
    by one bar.'
  evidence:
  - planetlib.solubility.hirschmann2012.upstream_review
  sympy: {format: sympy-srepr-v1, expression: 'Equality(log(Mul(Symbol(''X''), Pow(Symbol(''f''), Integer(-1)))),
      Add(Mul(Integer(-1), Rational(19, 25), Symbol(''P'')), Rational(-11403, 1000)))'}
- id: planetlib.solubility.hirschmann2012.endmember_regression
  revision: '2'
  description: ExoEOS conditional variant using the same fitted numbers on an endmember-based concentration.
  scope: Equilibrium H2 relation of the provider scalar with zero extra H2 offset; not identified with the original
    oxide-based fit.
  symbols:
    X: {latex: X, description: Molecular H2 fraction on the dry MELTS endmember-plus-water-plus-H2 basis., unit: '1'}
    f: {latex: f, description: Molecular hydrogen fugacity., unit: bar}
    P: {latex: P, description: Melt total pressure., unit: GPa}
  assumptions:
  - The gas and dissolved H2 standards share a one-bar reference.
  - The extra h2_offset_rt is zero.
  - No oxide-basis correction or new empirical calibration is inferred.
  - 'SymPy symbols are numerical magnitudes: P in GPa, f in bar, and X dimensionless; log(X/f) uses fugacity divided
    by one bar.'
  evidence:
  - planetlib.solubility.hirschmann2012.provider
  - planetlib.solubility.hirschmann2012.upstream_review
  sympy: {format: sympy-srepr-v1, expression: 'Equality(log(Mul(Symbol(''X''), Pow(Symbol(''f''), Integer(-1)))),
      Add(Mul(Integer(-1), Rational(19, 25), Symbol(''P'')), Rational(-11403, 1000)))'}
- id: planetlib.solubility.hirschmann2012.oxide_regression
  revision: '1'
  latex: \ln\!\left(\frac{X}{f/(1\,\mathrm{bar})}\right)=-11.403-0.76\frac{P}{1\,\mathrm{GPa}}
  description: Basalt Fig. 4 pressure regression using the reviewed oxide-based concentration reconstruction.
  scope: Paper coefficient values and oxide-component meaning retained with the unresolved normalization caveat.
  symbols:
    X: {latex: X, description: Molecular H2 fraction on the reconstructed oxide-plus-water-plus-H2 basis., unit: '1'}
    f: {latex: f, description: Molecular hydrogen fugacity., unit: bar}
    P: {latex: P, description: Melt total pressure., unit: GPa}
  assumptions:
  - No fitted temperature dependence is added.
  - The two pressure quantities retain their separate physical meanings.
  evidence:
  - planetlib.solubility.hirschmann2012.upstream_review
- id: planetlib.solubility.hirschmann2012.endmember_regression
  revision: '1'
  latex: \ln\!\left(\frac{X}{f/(1\,\mathrm{bar})}\right)=-11.403-0.76\frac{P}{1\,\mathrm{GPa}}
  description: ExoEOS conditional variant using the same fitted numbers on an endmember-based concentration.
  scope: Equilibrium H2 relation of the provider scalar with zero extra H2 offset; not identified with the original
    oxide-based fit.
  symbols:
    X: {latex: X, description: Molecular H2 fraction on the dry MELTS endmember-plus-water-plus-H2 basis., unit: '1'}
    f: {latex: f, description: Molecular hydrogen fugacity., unit: bar}
    P: {latex: P, description: Melt total pressure., unit: GPa}
  assumptions:
  - The gas and dissolved H2 standards share a one-bar reference.
  - The extra h2_offset_rt is zero.
  - No oxide-basis correction or new empirical calibration is inferred.
  evidence:
  - planetlib.solubility.hirschmann2012.provider
  - planetlib.solubility.hirschmann2012.upstream_review
