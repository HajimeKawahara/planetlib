  revision: '1'
  latex: M_s
  description: Molar mass of the counted solute species, including its atomic or molecular convention.
  unit: kg mol^-1
  domain: Positive and composition independent.
- id: planetlib.thermodynamics.mass_fraction_solute.ns
  revision: '1'
  latex: n_s
  description: Amount of the solute species counted by Ms.
  unit: mol
  domain: Positive interior amount; zero solute is a separate continuous energy limit.
- id: planetlib.thermodynamics.mass_fraction_solute.S
  revision: '1'
  latex: N_*
  description: Total host mass divided by solute molar mass; a mass-equivalent amount, not the host molecular count.
  unit: mol
  domain: Positive host mass; two-component host in this minimal model.
- id: planetlib.thermodynamics.mass_fraction_solute.w
  revision: '1'
  latex: w
  description: Solute mass divided by host mass plus solute mass.
  unit: '1'
  domain: Strictly between zero and one in the differentiable interior.
- id: planetlib.thermodynamics.mass_fraction_solute.u0
  revision: '1'
  latex: u_s^0
  description: Solute standard chemical potential divided by R T.
  unit: '1'
  domain: Finite, fixed with respect to all component amounts.
- id: planetlib.thermodynamics.mass_fraction_solute.F
  revision: '1'
  latex: \Delta G/(RT)
  description: Added extensive Gibbs energy divided by R T, to be added to an already mixed host energy.
  unit: mol
  domain: Same R and fixed T/P as the supplied host model; host mixing is not repeated.
- id: planetlib.thermodynamics.mass_fraction_solute.us
  revision: '1'
  latex: u_s
  description: Solute chemical potential divided by R T.
  unit: '1'
  domain: Positive solute and host amounts.
- id: planetlib.thermodynamics.mass_fraction_solute.du1
  revision: '1'
  latex: \Delta u_1
  description: Increment to host component 1 chemical potential divided by R T.
  unit: '1'
  domain: Added to the corresponding derivative of the supplied host Gibbs energy.
- id: planetlib.thermodynamics.mass_fraction_solute.du2
  revision: '1'
  latex: \Delta u_2
  description: Increment to host component 2 chemical potential divided by R T.
  unit: '1'
  domain: Added to the corresponding derivative of the supplied host Gibbs energy.
