schema_version: '0.6'
model:
  id: planetlib.thermodynamics.helmholtz
  name: Fixed-composition molar Helmholtz response relations
  description: An open derivative model for a smooth complete molar Helmholtz potential at fixed composition. Density
    is molar. The user supplies the potential, composition and mean molar mass. The stable response domain has T>0,
    rho>0, cv>0 and partial P/partial rho at fixed T positive. No phase selection, chemical equilibrium response,
    EOS coefficients or numerical differentiation method is selected.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/thermodynamics/helmholtz.yaml
assumptions:
- statement: The potential is twice continuously differentiable on the selected single-phase interior, allowing
    the mixed derivatives to commute.
  evidence:
  - planetlib.thermodynamics.helmholtz.source
- statement: All T/rho partial derivatives hold composition fixed. Mean molar mass is constant in these derivatives.
  evidence:
  - planetlib.thermodynamics.helmholtz.source
- statement: cp and sound speed require nonzero cv and pressure-density derivative; singular states and phase boundaries
    are outside this model.
  evidence:
  - planetlib.thermodynamics.helmholtz.source
- statement: Every symbol denotes a numerical magnitude in its stated SI units; no automatic unit conversion is
    implied.
  evidence:
  - planetlib.thermodynamics.helmholtz.source
domains:
- kind: scientific_applicability
  status: unknown
  description: No target-specific physical assessment is asserted by this shared definition.
  conditions: []
  evidence:
