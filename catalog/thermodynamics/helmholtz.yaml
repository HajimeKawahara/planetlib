claims:
- id: planetlib.thermodynamics.helmholtz.mathematical_consistency
  revision: '1'
  kind: theoretical
  statement: On the smooth stable fixed-composition domain, the stored pressure/entropy relations satisfy Maxwell
    symmetry, the stored cp and sound-speed expressions follow from constant-pressure and constant-entropy derivatives,
    and a constant-cv ideal-gas potential yields cp-cv=R and cs2=gamma*R*T/M.
  scope: An open derivative model for a smooth complete molar Helmholtz potential at fixed composition. Density
    is molar. The user supplies the potential, composition and mean molar mass. The stable response domain has T>0,
    rho>0, cv>0 and partial P/partial rho at fixed T positive. No phase selection, chemical equilibrium response,
    EOS coefficients or numerical differentiation method is selected. The executable checks use stored symbolic
    definitions; these are not empirical or code-correspondence claims.
  mathematical_models:
  - {id: planetlib.thermodynamics.helmholtz.model, revision: '1'}
- id: planetlib.thermodynamics.helmholtz.source_correspondence
  revision: '1'
  kind: theoretical
  statement: The extraction preserves the selected source conventions and implementation intent.
  scope: Requires a separate source-to-definition review; symbolic identities alone do not establish provider equivalence.
  mathematical_models:
  - {id: planetlib.thermodynamics.helmholtz.model, revision: '1'}
- id: planetlib.thermodynamics.helmholtz.physical_applicability
  revision: '1'
  kind: physical_validation
  statement: The partial model is empirically adequate for a specified consumer environment.
  scope: No target material, error criterion or independent empirical comparison is specified.
  mathematical_models:
