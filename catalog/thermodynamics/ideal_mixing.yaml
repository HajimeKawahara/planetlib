schema_version: '0.6'
model:
  id: planetlib.thermodynamics.ideal_mixing
  name: Binary ideal mixing Gibbs energy and chemical potentials
  description: 'Two components at fixed temperature and pressure, with composition-independent supplied standards.
    The finite two-component model is a minimal reusable instance, not an arbitrary-species solver. Pressure contributions
    belong to the supplied standards: one-bar ideal-gas standards require a separate ln(P/P0) addition exactly once.
    No gas law, activity correction, phase equilibrium or boundary derivative is selected.'
  implementation: &id001
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/thermodynamics/ideal_mixing.yaml
assumptions:
- statement: Amounts are positive for chemical-potential derivatives; the zero-amount energy limit does not define
    a finite insertion potential.
  evidence:
  - planetlib.thermodynamics.ideal_mixing.source
- statement: The scalar G/(R T) has units of mol, whereas each chemical potential divided by R T is dimensionless.
  evidence:
  - planetlib.thermodynamics.ideal_mixing.source
- statement: The selected standards already refer to the fixed pressure; ideal mixing is counted exactly once.
  evidence:
  - planetlib.thermodynamics.ideal_mixing.source
domains:
- kind: scientific_applicability
  status: unknown
  description: No target-specific physical assessment is asserted by this shared definition.
  conditions: []
