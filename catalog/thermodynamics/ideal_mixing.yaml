  revision: '1'
  kind: theoretical
  statement: For positive binary amounts at fixed T/P, differentiating the stored Gibbs scalar yields both stored
    potentials, the Euler relation holds, and its Hessian is symmetric with the amount vector in its null space.
  scope: 'Two components at fixed temperature and pressure, with composition-independent supplied standards. The
    finite two-component model is a minimal reusable instance, not an arbitrary-species solver. Pressure contributions
    belong to the supplied standards: one-bar ideal-gas standards require a separate ln(P/P0) addition exactly once.
    No gas law, activity correction, phase equilibrium or boundary derivative is selected. The executable checks
    use stored symbolic definitions; these are not empirical or code-correspondence claims.'
