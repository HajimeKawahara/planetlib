quantities:
- id: planetlib.atomic.balance.quantity.nl
  revision: '1'
  latex: n_l
  description: Lower-state particle number per volume.
  unit: cm^-3
  domain: Nonnegative; the closed example contains exactly these two bound states.
- id: planetlib.atomic.balance.quantity.nu
  revision: '1'
  latex: n_u
  description: Upper-state particle number per volume.
  unit: cm^-3
  domain: Nonnegative; same atomic species as the lower state.
- id: planetlib.atomic.balance.quantity.Plu
  revision: '1'
  latex: P_{lu}
  description: Per-particle upward rate from lower to upper state.
  unit: s^-1
  domain: Nonnegative; radiation and collisions may contribute.
- id: planetlib.atomic.balance.quantity.Pul
  revision: '1'
  latex: P_{ul}
  description: Per-particle downward rate from upper to lower state.
  unit: s^-1
  domain: Nonnegative; no unrecorded loss channel.
- id: planetlib.atomic.balance.quantity.Ql
  revision: '1'
  latex: Q_l
  description: Net lower-state particle production per volume.
  unit: cm^-3 s^-1
  domain: Finite numerical values in the declared units.
- id: planetlib.atomic.balance.quantity.Qu
  revision: '1'
  latex: Q_u
  description: Net upper-state particle production per volume.
  unit: cm^-3 s^-1
  domain: Finite numerical values in the declared units.
- id: planetlib.atomic.balance.quantity.S
  revision: '1'
  latex: S_i
  description: Saha ratio n_i/(n_e n_p), with the adopted electron-spin factor.
  unit: cm^3
  domain: Positive; same finite-state binding energy and statistical weight as the inverse kernel.
- id: planetlib.atomic.balance.quantity.b
  revision: '1'
  latex: b^*_{i\nu}
  description: Inverse-continuum population factor per electron-proton density product.
  unit: cm^3
  domain: Positive at finite positive frequency and temperature.
- id: planetlib.atomic.balance.quantity.eta
  revision: '1'
  latex: \eta_\nu
  description: Planck photon occupation at the same material temperature.
  unit: '1'
  domain: Positive; no dilution is applied in this conditional model.
- id: planetlib.atomic.balance.quantity.T
  revision: '1'
  latex: T
  description: Common electron, ion and Planck radiation temperature.
  unit: K
  domain: T > 0.
- id: planetlib.atomic.balance.quantity.f
  revision: '1'
  latex: \nu
  description: Ordinary photon frequency in the local rest frame.
  unit: Hz
  domain: f > 0; sigma is zero below the specified threshold.
- id: planetlib.atomic.balance.quantity.h
  revision: '1'
  latex: h
  description: Planck constant for ordinary frequency.
  unit: erg s
  domain: Positive physical constant.
- id: planetlib.atomic.balance.quantity.k
  revision: '1'
  latex: k_{\rm B}
  description: Boltzmann constant.
  unit: erg K^-1
  domain: Positive physical constant.
- id: planetlib.atomic.balance.quantity.c
  revision: '1'
  latex: c
  description: Vacuum speed of light.
  unit: cm s^-1
  domain: Positive physical constant.
- id: planetlib.atomic.balance.quantity.me
  revision: '1'
  latex: m_e
  description: Electron mass used in the thermal translational factor.
  unit: g
  domain: Positive physical constant; provider reduced-mass choices are not inferred.
- id: planetlib.atomic.balance.quantity.g
  revision: '1'
  latex: g_i
  description: Statistical weight of the selected bound state.
  unit: '1'
  domain: Positive; electron spin degeneracy is the explicit factor two.
- id: planetlib.atomic.balance.quantity.binding
  revision: '1'
  latex: \chi_i
  description: Ionization energy from the selected bound state.
  unit: erg
  domain: Positive; the same threshold defines the support of sigma.
- id: planetlib.atomic.balance.quantity.sigma
  revision: '1'
  latex: \sigma_{i\nu}
  description: Photoionization cross section shared by all forward and inverse coefficients.
  unit: cm^2
  domain: Nonnegative, externally supplied; zero below h f = binding.
- id: planetlib.atomic.balance.quantity.ni
  revision: '1'
  latex: n_i
  description: Number density of the selected bound state in the Saha closure.
  unit: cm^-3
  domain: Nonnegative; not the two-state example population nl or nu.
- id: planetlib.atomic.balance.quantity.ne
  revision: '1'
  latex: n_e
  description: Electron number density supplied to the one-level inverse pair.
  unit: cm^-3
  domain: Positive; full charge closure is outside this submodel.
- id: planetlib.atomic.balance.quantity.np
  revision: '1'
  latex: n_p
  description: Proton number density supplied to the one-level inverse pair.
  unit: cm^-3
  domain: Positive; full nuclear conservation is outside this submodel.
- id: planetlib.atomic.balance.quantity.gamma
  revision: '1'
  latex: \Gamma_{i\nu}
  description: Photoionization rate integrand per bound particle and ordinary frequency.
  unit: s^-1 Hz^-1
  domain: Finite numerical values in the declared units.
- id: planetlib.atomic.balance.quantity.alpha
  revision: '1'
  latex: \alpha_{i\nu}
  description: Radiative recombination coefficient integrand including stimulated recombination.
  unit: cm^3 s^-1 Hz^-1
  domain: Finite numerical values in the declared units.
- id: planetlib.atomic.balance.quantity.chi
  revision: '1'
  latex: \chi_\nu^{\rm bf}
  description: Signed bound-free extinction including stimulated recombination.
  unit: cm^-1
  domain: Finite numerical values in the declared units.
- id: planetlib.atomic.balance.quantity.j
  revision: '1'
  latex: j_\nu^{\rm bf}
  description: Spontaneous bound-free emissivity per steradian and ordinary frequency.
  unit: erg s^-1 cm^-3 sr^-1 Hz^-1
  domain: Finite numerical values in the declared units.
