schema_version: '0.6'
model:
  id: planetlib.atomic.balance.catalog
  name: Closed bound-state balance and a conditional Milne-Saha pair
  description: Two bound states form a closed bound-bound example. The separate one-level bound-free model adopts
    Saha populations and Planck radiation at the same positive T; it is a conditional inverse-process identity,
    not a full-atom LTE closure. The common supplied cross section is nonnegative above the actual ionization threshold
    and zero below it; no Kramers or Coulomb approximation is selected. One-way two-photon loss, external pumps,
    other levels and advection are excluded from the two-state conservation example. Frequency integrands use ordinary
    Hz and identical quadrature weights when integrated.
  implementation: &id002
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/atomic/rate_balance.yaml
