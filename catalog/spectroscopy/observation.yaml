schema_version: '0.6'
model:
  id: planetlib.spectroscopy.observation
  name: Spectral broadening and first-order Doppler sampling
  description: Continuous normalized velocity kernels and first-order Doppler sampling of a supplied spectrum. Velocity
    quantities use km/s consistently. Rotation assumes a rigid spherical disk with a spatially common local spectrum
    and the stated quadratic limb-darkening law. Finite sampled kernels, log-grid approximations, interpolation,
    endpoint padding and zero-rotation delta handling remain provider choices.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/spectroscopy/observation.yaml
assumptions:
- statement: beta and vsini are positive. The limb-darkening profile is nonnegative on 0 <= mu <= 1 and 1-u1/3-u2/6
    > 0.
  evidence:
  - planetlib.spectroscopy.observation.source
- statement: The first-order radial-velocity rule uses |RV/c| << 1 and samples the input spectrum at w_obs*(1+RV/c);
    it is not a relativistic transformation or a spectral-flux amplitude transformation.
  evidence:
  - planetlib.spectroscopy.observation.source
- statement: Continuous convolution preserves an integrable spectrum over the whole real coordinate when the chosen
    kernel integrates to one. Finite grids may lose edge flux.
  evidence:
  - planetlib.spectroscopy.observation.source
domains:
- kind: scientific_applicability
  status: unknown
  description: The definition is a conditional partial model, with no adopted empirical validation.
  conditions: []
  evidence:
  - planetlib.spectroscopy.observation.source
limitations:
- statement: Continuous normalized velocity kernels and first-order Doppler sampling of a supplied spectrum. Velocity
    quantities use km/s consistently. Rotation assumes a rigid spherical disk with a spatially common local spectrum
    and the stated quadratic limb-darkening law. Finite sampled kernels, log-grid approximations, interpolation,
    endpoint padding and zero-rotation delta handling remain provider choices.
  evidence:
  - planetlib.spectroscopy.observation.source
- statement: Numerical algorithms, fitted data, discretization choices and floating-point accuracy remain provider
    responsibilities.
  evidence:
  - planetlib.spectroscopy.observation.source
claims:
- id: planetlib.spectroscopy.observation.mathematical_consistency
  revision: '1'
  kind: theoretical
  statement: The Gaussian and physical quadratic-limb rotation kernels integrate to one; the rotational strip integral
    agrees with the stated disk intensity law, and zero radial velocity preserves the sampling coordinate.
  scope: Conditional mathematical checks only; neither provider equivalence nor physical applicability is inferred.
  mathematical_models:
  - id: planetlib.spectroscopy.observation.model
    revision: '1'
- id: planetlib.spectroscopy.observation.source_correspondence
  revision: '1'
  kind: theoretical
  statement: The shared definitions preserve the selected conventions of the inspected implementation.
  scope: The source supplied the extraction target; a separate correspondence review is required.
  mathematical_models:
  - id: planetlib.spectroscopy.observation.model
    revision: '1'
- id: planetlib.spectroscopy.observation.physical_applicability
  revision: '1'
  kind: physical_validation
  statement: The selected relations have adequate accuracy for a specified physical target.
  scope: No target, empirical error criterion or independent observation is selected by this library entry.
  mathematical_models:
  - id: planetlib.spectroscopy.observation.model
    revision: '1'
evidence:
- id: planetlib.spectroscopy.observation.source
  kind: implementation
  summary: Mathematical conventions extracted from immutable ExoJAX source.
  sources:
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/postproc/response.py
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/postproc/spin_rotation.py
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/postproc/limb_darkening.py
  scope: The cited source implementations were inspected. This is not a new inspection of their original literature
