- id: planetlib.spectroscopy.observation.gaussian_kernel
  revision: '1'
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Function('K_G')(Symbol('v', real=True)), Mul(Rational(1, 2), Pow(Integer(2), Rational(1,
      2)), Pow(pi, Rational(-1, 2)), Pow(Symbol('beta', real=True), Integer(-1)), exp(Mul(Integer(-1), Rational(1,
      2), Pow(Symbol('beta', real=True), Integer(-2)), Pow(Symbol('v', real=True), Integer(2))))))
  description: Continuous normalized Gaussian broadening kernel.
  scope: Continuous normalized velocity kernels and first-order Doppler sampling of a supplied spectrum. Velocity
    quantities use km/s consistently. Rotation assumes a rigid spherical disk with a spatially common local spectrum
    and the stated quadratic limb-darkening law. Finite sampled kernels, log-grid approximations, interpolation,
    endpoint padding and zero-rotation delta handling remain provider choices.
  assumptions: &id002
  - beta and vsini are positive. The limb-darkening profile is nonnegative on 0 <= mu <= 1 and 1-u1/3-u2/6 > 0.
  - The first-order radial-velocity rule uses |RV/c| << 1 and samples the input spectrum at w_obs*(1+RV/c); it is
    not a relativistic transformation or a spectral-flux amplitude transformation.
  - Continuous convolution preserves an integrable spectrum over the whole real coordinate when the chosen kernel
    integrates to one. Finite grids may lose edge flux.
