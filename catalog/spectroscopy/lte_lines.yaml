schema_version: '0.6'
model:
  id: planetlib.spectroscopy.lte_lines
  name: LTE molecular line strength and normalized Voigt profile
  description: One isolated transition per absorber, ordinary spectroscopic wavenumber in cm^-1, LTE strength scaling
    and a normalized Voigt profile. The total line cross section is the sum of such contributions. The Lorentz width
    is supplied externally; pressure-broadening prescriptions, line truncation, line lists and partition-function
    data are not chosen.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/planetlib
    revision: definition:1
    entry_points:
    - catalog/spectroscopy/lte_lines.yaml
assumptions:
- statement: T, T_ref, w0, Q_ratio, sigma_D, gamma_L and absorber mass are positive; the Gaussian width is a standard
    deviation and the Lorentz width is a half width at half maximum.
  evidence:
  - planetlib.spectroscopy.lte_lines.source
- statement: Q_ratio means Q(T)/Q(T_ref), using the same absorber and partition-function convention as S_ref. E_lower
    is expressed as a wavenumber, not an energy in erg.
  evidence:
  - planetlib.spectroscopy.lte_lines.source
- statement: The untruncated profile integrates over the whole real wavenumber offset. Absorber counting and isotopic
    abundance conventions belong to the supplied S_ref.
  evidence:
  - planetlib.spectroscopy.lte_lines.source
domains:
- kind: scientific_applicability
  status: unknown
  description: The definition is a conditional partial model, with no adopted empirical validation.
  conditions: []
  evidence:
  - planetlib.spectroscopy.lte_lines.source
limitations:
- statement: One isolated transition per absorber, ordinary spectroscopic wavenumber in cm^-1, LTE strength scaling
    and a normalized Voigt profile. The total line cross section is the sum of such contributions. The Lorentz width
    is supplied externally; pressure-broadening prescriptions, line truncation, line lists and partition-function
    data are not chosen.
  evidence:
  - planetlib.spectroscopy.lte_lines.source
- statement: Numerical algorithms, fitted data, discretization choices and floating-point accuracy remain provider
    responsibilities.
  evidence:
  - planetlib.spectroscopy.lte_lines.source
claims:
- id: planetlib.spectroscopy.lte_lines.mathematical_consistency
  revision: '1'
  kind: theoretical
  statement: At the reference temperature and unit partition-function ratio, S equals S_ref; the Gaussian and Lorentz
    densities are normalized, their convolution is normalized, each line integral is S, and the finite line sum
    is additive.
  scope: Conditional mathematical checks only; neither provider equivalence nor physical applicability is inferred.
  mathematical_models:
  - id: planetlib.spectroscopy.lte_lines.model
    revision: '1'
- id: planetlib.spectroscopy.lte_lines.source_correspondence
  revision: '1'
  kind: theoretical
  statement: The shared definitions preserve the selected conventions of the inspected implementation.
  scope: The source supplied the extraction target; a separate correspondence review is required.
  mathematical_models:
  - id: planetlib.spectroscopy.lte_lines.model
    revision: '1'
- id: planetlib.spectroscopy.lte_lines.physical_applicability
  revision: '1'
  kind: physical_validation
  statement: The selected relations have adequate accuracy for a specified physical target.
  scope: No target, empirical error criterion or independent observation is selected by this library entry.
  mathematical_models:
  - id: planetlib.spectroscopy.lte_lines.model
    revision: '1'
evidence:
- id: planetlib.spectroscopy.lte_lines.source
  kind: implementation
  summary: Mathematical conventions extracted from immutable ExoJAX source.
  sources:
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/database/core/line_strength.py
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/database/core/broadening.py
