      Symbol('c2', real=True), Symbol('w0', real=True))))), Pow(Add(Integer(1), Mul(Integer(-1), exp(Mul(Integer(-1),
      Pow(Symbol('T_ref', real=True), Integer(-1)), Symbol('c2', real=True), Symbol('w0', real=True))))), Integer(-1)),
      exp(Mul(Integer(-1), Symbol('E_lower', real=True), Symbol('c2', real=True), Add(Mul(Integer(-1), Pow(Symbol('T_ref',
      real=True), Integer(-1))), Pow(Symbol('T', real=True), Integer(-1)))))))
  description: LTE temperature scaling with stimulated-emission correction.
  scope: One isolated transition per absorber, ordinary spectroscopic wavenumber in cm^-1, LTE strength scaling
    and a normalized Voigt profile. The total line cross section is the sum of such contributions. The Lorentz width
