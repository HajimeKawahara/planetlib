name: Check definitions
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/planetlib.py check
      - name: Preserve published definition revisions
        env:
          PLANETLIB_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: |
          if [ "$PLANETLIB_BASE" = "0000000000000000000000000000000000000000" ]; then
            PLANETLIB_BASE=origin/main
          fi
          python tools/check_history.py --base "$PLANETLIB_BASE"
      - run: python -m pytest -q
